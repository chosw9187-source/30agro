:root{

}

  --accent:#3fb877; --accent-ink:#06130c; --accent-soft:#183326; --navy:#9cc2ea;
  --input:#4a4318; --stay:#3a3519; --cap:#5a3a22; --ovr:#1d3a52; --ov12:#1f4a2c; --ov23:#1f3a55; --ov34:#5a3624; --cell-ink:#e4ece7;
  --crit:#ff7b6b; --crit-soft:#46201b; --warn:#f2a256; --warn-soft:#432d16; --care:#e3c75a; --care-soft:#3a3315;
  --ok:#5fcf8f; --ok-soft:#173826; --under:#7fb1f0; --under-soft:#1a2c46; --hl:rgba(242,162,86,.16); --vsafe:#6cc3e0; --vsafe-soft:#14313b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1d2722; --ink:#e4ece7; --muted:#97a69e; --line:#2a3630; --line-2:#3a4942;
  --accent:#3fb877; --accent-ink:#06130c; --accent-soft:#183326; --navy:#9cc2ea;
  --input:#4a4318; --stay:#3a3519; --cap:#5a3a22; --ovr:#1d3a52; --ov12:#1f4a2c; --ov23:#1f3a55; --ov34:#5a3624; --cell-ink:#e4ece7;
  --crit:#ff7b6b; --crit-soft:#46201b; --warn:#f2a256; --warn-soft:#432d16; --care:#e3c75a; --care-soft:#3a3315;
  --ok:#5fcf8f; --ok-soft:#173826; --under:#7fb1f0; --under-soft:#1a2c46; --hl:rgba(242,162,86,.16); --vsafe:#6cc3e0; --vsafe-soft:#14313b; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}

.grid2eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
table.info{width:100%} table.info th{font-size:12px;line-height:1.3}
th.fth{cursor:pointer;user-select:none;padding-right:20px}

.fcount button{font-size:12px;padding:2px 8px}
.col-hid{display:none!important}
.colbar{position:sticky;left:0;display:flex;justify-content:flex-end;margin:0 0 6px}
.colbtn{white-space:nowrap} .colbtn:hover{border-color:var(--accent);color:var(--accent)}

thead th.sorted,thead th.filtered{background:var(--warn)!important;color:#fff!important}
td.colhl{background-image:linear-gradient(var(--hl),var(--hl));box-shadow:inset 2px 0 0 var(--warn),inset -2px 0 0 var(--warn)}

.curcol{background:var(--surface-2)!important;color:var(--muted)}

.scale{display:flex;border-radius:6px;overflow:hidden;margin-top:8px;font-size:11px;color:#fff;text-align:center}
.scale span{padding:4px 2px;min-width:0;line-height:1.25} .scale b{display:block;font-size:11px}

.yearsel{display:inline-flex;gap:4px;align-items:center} .yearsel select{font-weight:700;background:var(--input);color:var(--cell-ink)} .yearsel button{padding:4px 8px}

.salbar{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:4px 0 8px}

.note.cap{margin:0 0 4px;height:18px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function stageBar(cur,attr,rpt){return`<div class="stagebar" role="tablist">
  <button role="tab" ${attr}="1" aria-selected="${cur!=='2'&&cur!=='3'}"><span class="stn">1차 분류</span><span class="std">직급 G1~G4 확정</span></button><span class="starr">→</span>
  <button role="tab" ${attr}="2" aria-selected="${cur==='2'}"><span class="stn">2차 분류 (최종)</span><span class="std">1차 확정 직급 + 년차 확정 (G1·1년차 ~ G4·${stepN(S.crit)}년차)</span></button>${rpt?`<span class="starr">→</span>
  <button role="tab" ${attr}="3" aria-selected="${cur==='3'}"><span class="stn">보고용</span><span class="std">기본 현황 · 분류체계 · 최종 결과 · 특이인원</span></button>`:''}</div>`;}
function renderPaybandOld(){
  const v=document.getElementById('view-payband');const st=S.stage==='2'||S.stage==='3'?S.stage:'1';
  const list=st==='2'?SHEETS2:SHEETS;const key=st==='2'?(SHEETS2.some(x=>x[0]===S.sheet2)?S.sheet2:'s2class'):S.sheet;
  v.innerHTML=`<h1>직급 Pay-band 분류</h1>${stageBar(st,'data-stage',true)}
  <div class="sheettabs" role="tablist" ${st==='3'?'hidden':''}>${list.map(([k,l])=>`<button role="tab" data-sheet="${k}" aria-selected="${key===k}">${l}</button>`).join('')}</div>
  <div id="sheet-body"></div>`;
  v.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{S.stage=b.dataset.stage;save();renderPayband();});
  v.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{if(st==='2')S.sheet2=b.dataset.sheet;else S.sheet=b.dataset.sheet;save();renderPayband();});
  if(st==='3')sheetReport();
  else if(st==='2')({s2class:sheet2Class,s2life:sheet2Life,s2detail:sheet2Detail}[key]||sheet2Class)();
  else({info:sheetInfo,class:sheetClass,life:sheetLife,detail:sheetDetail}[S.sheet]||sheetInfo)();
}

function setCrit(path,val){const c=S.crit;
  {const [a,i]=path.split('.');
   if(a==='gmap'){c.gmap[i]=val;return;}if(a==='baseYr'){c.baseYr[i]=val===''?'':+val;return;}
   if(a==='yStart'){c.yStart[+i]=Math.max(2,+val||2);return;}if(a==='roles'){c.roles[+i][1]=val;return;}if(a==='w'){c.w[+i]=Math.max(0,+val||0);return;}if(a==='refDate'){c.refDate=/^\d{4}-\d{2}-\d{2}$/.test(val)?val:REF_DEFAULT;return;}if(a==='cuts'){c.cuts=compCuts(c);c.cuts[+i]=Math.min(4,Math.max(1,+val||1));return;}if(a==='roleMap'){c.roleMap=c.roleMap||{};c.roleMap[i]=val;return;}if(a==='salPick'){c.salPick=val;return;}}
  if(path==='ratePct'){c.rate=(+val||0)/100;return;}
  if(path==='mode'){c.mode=val;return;}
  if(path==='retAge'){c.retAge=+val||0;return;}
  if(path==='ageYear'){c.ageYear=+val||TODAY.getFullYear();applyBirthAges();return;}
  if(['firstYear','baseYear','delayPer'].includes(path)){c[path]=+val||0;return;}
  const [a,i,j]=path.split('.');
  if(a==='promo'){c.promo[+i]=+val||0;return;}
  if(a==='target'){(c.target[i]=c.target[i]||['','',''])[+j]=val;return;}
  if(a==='evalTbl'){c.evalTbl[i][+j]=j==='0'?(+val||0):val;return;}
  c[a][+i][+j]=+val||0;}

/* =========================================================
   직급 분류 (신규 기준) — 분류 기준 → 1차 분류 → 1차 특이사항 보고 → 2차 분류 → 2차 특이사항 보고 → 최종 직급
   1차 분류 = (1) 현직급 변환 (2) 년차 (3) 직무 역할 (4) 연봉(Pay-band) → (5) 종합 등급
   ========================================================= */
const ROLE_DEF={'전략적 판단':'전사 방향 제시 · 담당 분야 최종 판단','과제 리딩':'다수 인원 과제 운영 · 성과 창출','자율 · 기획 업무':'업무 자체 계획 · 완결 · 기획','정형 업무':'절차 · 매뉴얼에 따른 정확한 처리'};
const CRIT_N=['(1) 현직급 변환','(2) 년차','(3) 직무 역할','(4) 연봉 (Pay-band)'];
const gN=g=>/^G[1-4]$/.test(g||'')?+g[1]:null;
const gTxt=x=>x==null?'-':'G'+x;
const gCls=x=>x==null?'':'gc'+Math.round(x);
// 년차 = (입사일 ~ 현직급 발령일) + 현직급 기간(조정 포함) + 경력인정(년) → 입사 연도 = 1년차 (예: 25년 입사 → 25년 1년차 · 26년 2년차 · 27년 3년차)
// 신입(입사일 = 발령일)은 현직급 기간이 곧 근속
function tenureParts(p){const h=new Date(dateStr(p.hire)),g=new Date(dateStr(p.gdate));let pre=null;
  if(!isNaN(h)&&!isNaN(g)){pre=(g.getFullYear()-h.getFullYear())*12+(g.getMonth()-h.getMonth());if(g.getDate()<h.getDate())pre--;pre=Math.max(0,pre);}
  if(p.newbie){let m=null;const R=REFD();if(!isNaN(h)){m=(R.getFullYear()-h.getFullYear())*12+(R.getMonth()-h.getMonth());if(R.getDate()<h.getDate())m--;m=Math.max(0,m);}
    const a=Math.round((num(p.adj)||0)*12);const per=m==null?periodMonths(p):m+a;return{newbie:true,pre:0,per,car:0,total:Math.max(0,per||0),ok:per!=null};}
  const per=periodMonths(p);const car=Math.round((num(p.career)||0)*12);
  return{pre,per,car,total:Math.max(0,(pre||0)+(per||0)+car),ok:per!=null||pre!=null||car!==0};}
// 년차 = 기준일 연도 − 입사 연도 + 경력인정(년) + 조정(±년)  (예: 27년 기준 26년 입사 = 1년차, 23년 입사 = 4년차 + 경력인정 + 조정)
//   신입은 경력인정 없음 (조정은 반영) / 소수는 올림, 최소 1년차
function yearParts(p){const h=new Date(dateStr(p.hire));const ry=REFD().getFullYear();
  if(isNaN(h))return null;return{by:h.getFullYear(),ry,base:ry-h.getFullYear(),car:p.newbie?0:(num(p.career)||0),adj:num(p.adj)||0};}
function autoYears(p){const y=yearParts(p);if(!y)return null;return Math.max(1,Math.ceil(y.base+y.car+y.adj-1e-9));}
// 년차: 기본정보에서 수기 입력(p.yrsM)이 있으면 그 값 우선
function careerYears(p,c){const m=num(p.yrsM);if(m!=null&&m>=1)return Math.round(m);return autoYears(p);}
function tenureTip(p){const y=yearParts(p);if(!y)return'입사일이 없어 계산 불가';const a=autoYears(p);
  return`${y.ry}년 − ${y.by}년 입사 = ${y.base}년${y.car?` + 경력인정 ${y.car}년`:''}${y.adj?` ${y.adj>0?'+':'−'} 조정 ${Math.abs(y.adj)}년`:''} → ${a}년차${y.base+y.car+y.adj<1?' (최소 1년차)':''}`;}
function yearGrade(y,c){if(y==null)return null;const s=c.yStart;return y>=s[3]?4:y>=s[2]?3:y>=s[1]?2:1;}
function yearRange(i,c){const s=c.yStart;return i<3?`${s[i]}~${s[i+1]-1}년차`:`${s[3]}년차 이상`;}
function roleGrade(role,c){const r=(c.roles||[]).find(x=>x[0]===role);return r?gN(r[1]):null;}
function salVal(k){if(!k)return null;if(k==='밴드 미달')return 1;if(k==='밴드 초과')return 4;return CLS_RANK[k];} // 중첩 = 중간값(G1·G2 = 1.5)
// (3) 직무 역할 미입력 → (1) 변경 직급에 해당하는 역할 자동 적용
function autoRole(p,c){const g=(c.roleMap||c.gmap||{})[p.grade];return((c.roles||[]).find(r=>r[1]===g)||[])[0]||'';}
// (4) 연봉: 현 연봉이 들어가는 Pay-band 직급 (여러 밴드에 걸치면 하위/상위 중 기준 설정값, 밴드 밖은 미달 G1 · 초과 G4)
// (4) 연봉: 현 연봉이 들어가는 Pay-band 직급. 여러 밴드에 걸치면 (1) 변경 직급 밴드 우선, 아니면 변경 직급에 가까운 쪽 / 밴드 밖은 미달 G1 · 초과 G4

  const ov=[0,1,2,3].map(i=>gN((p.ov||[])[i]));const v=auto.map((x,i)=>ov[i]!=null?ov[i]:x);

  const key=st==='c'?(CSHEETS.some(x=>x[0]===S.sheetC)?S.sheetC:'c1'):st==='2'?(SHEETS2.some(x=>x[0]===S.sheet2)?S.sheet2:'s2class'):(SHEETS.some(x=>x[0]===S.sheet)?S.sheet:'info');

  <div id="sheet-body"></div>`;
  v.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{S.stage=b.dataset.stage;save();renderPayband();});
  v.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{if(st==='c')S.sheetC=b.dataset.sheet;else if(st==='2')S.sheet2=b.dataset.sheet;else S.sheet=b.dataset.sheet;save();renderPayband();});
  if(st==='c')({c1:sheetCrit1,c2:sheetCrit2}[key])();
  else if(st==='r1')sheetReportN();
  else if(st==='r2')sheetReport2N();
  else if(st==='4')sheetFinalN();
  else if(st==='2')({s2class:sheet2ClassN,s2life:sheet2Life,s2detail:sheet2Detail}[key]||sheet2ClassN)();
  else({info:sheetInfoN,class:sheetClassN,life:sheetLife,detail:sheetDetail}[key]||sheetInfoN)();
}

  if(!P.length)throw new Error('불러올 인원이 없습니다.');
  S.people=P;S.source='file';S.sourceName=fname;S.sel='';save();route();toast(`${P.length}명을 불러왔습니다.${C.role<0?' (직무 역할 열 없음 → 기본정보에서 선택)':''}`);}

function finderRows(rows){const g=S.findG||'';return rows.filter(r=>!g||'G'+r.app===g).sort((a,b)=>String(a.p.name).localeCompare(String(b.p.name),'ko'));}
function selRow(rows){const L=finderRows(rows);if(!L.length)return null;let r=L.find(x=>pkey(x.p)===S.sel);if(!r){r=L[0];S.sel=pkey(r.p);}return r;}

   <span class="nav2"><button type="button" id="fd-prev" aria-label="이전 인원">◀</button><button type="button" id="fd-next" aria-label="다음 인원">▶</button></span></div>`;}
function bindFinder(rows,fn){
  const prevSel=S.sel;const go=()=>{if(S.sel!==prevSel)S.manualG='';save();fn();};
  document.getElementById('fd-g').onchange=e=>{S.findG=e.target.value;S.sel='';go();};
  document.getElementById('sel-person').onchange=e=>{S.sel=e.target.value;go();};
  const step=d=>{const L=finderRows(rows);const i=L.findIndex(r=>pkey(r.p)===S.sel);if(!L.length)return;S.sel=pkey(L[(i+d+L.length)%L.length].p);go();};
  document.getElementById('fd-prev').onclick=()=>step(-1);document.getElementById('fd-next').onclick=()=>step(1);
  const q=document.getElementById('fd-q');
  const search=()=>{const s=q.value.trim();if(!s)return;
    if(/^g[1-4]$/i.test(s)){S.findG=s.toUpperCase();S.sel='';go();return;}
    const r=rows.find(x=>x.p.name===s||String(x.p.id)===s)||rows.find(x=>String(x.p.name).includes(s)||String(x.p.id).includes(s));
    if(!r){toast(`'${s}'에 맞는 인원이 없습니다.`);return;}
    if(S.findG&&'G'+r.app!==S.findG)S.findG='';S.sel=pkey(r.p);go();};
  q.addEventListener('change',search);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}});
}

// 최종 분류 직급(수기)과 연동되는 시나리오: 승진 반영(①~③에 같은 직급이 없을 때만). CAP은 수기 시나리오에서 직접 고를 때만 표시
function finScenarios(r,c,tab){if(!r||!r.app||!r.sal)return[];const f=r.app;const out=[];
  if(![r.sc1,r.sc2,r.sc3].some(s=>s&&s.g===f))out.push({lbl:r.fin?`최종 확정 G${f} (승진 반영)`:`종합 등급 G${f} (승진 반영)`,s:scenario(r.p,f,c,tab),fin:true});
  return out;}

function manualSel(c){const mm=/^G([1-4])(-CAP)?$/.exec(S.manualG||'');return mm?{g:+mm[1],cap:!!mm[2]}:null;}

    <div class="scroll"><table><thead><tr><th>시나리오</th><th>시작 직급</th><th>승진 경로(나이)</th><th>${c.retAge}세 직급</th><th>${c.retAge}세 최종연봉(원)</th></tr></thead><tbody>${all.map(line).join('')}</tbody></table></div>${r.fin?`<p class="note fin-note">▣ 굵은 초록 테두리 = 최종 분류 직급 <b>G${r.fin}</b>에서 시작하는 시나리오(승진 반영) + 오른쪽 「수기 시나리오」에서 직접 고른 시나리오(CAP 포함)</p>`:`<p class="note">※ 이 인원은 최종 분류 직급이 미확정입니다. 기본정보에서 최종 직급을 고르면 해당 직급 시나리오에 테두리가 표시됩니다.</p>`}

function lifeChart(r,c,series){
  if(!series.length)return'';const E=series[0].s.end;const age0=(num(r.p.age)||0)-1;
  const W=560,H=250,L=58,Rp=14,T=14,B=30;const xs=t=>L+(E?t/E:0)*(W-L-Rp);
  const vals=series.flatMap(o=>o.s.W.slice(0,E+1));const lo=Math.min(...vals)*0.95,hi=Math.max(...vals)*1.03;const ys=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-Rp}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end">${fM(v)}</text>`;}
  const step=E>20?5:E>10?2:1;for(let t=0;t<=E;t+=step)g+=`<text x="${xs(t)}" y="${H-10}" text-anchor="middle">${age0+t}세</text>`;
  const lines=series.map(o=>{const s=o.s;return`<polyline fill="none" stroke="${o.col}" stroke-width="${o.hl?4:2}" ${o.s.cap?'stroke-dasharray="6 4"':''} points="${s.W.slice(0,E+1).map((v,t)=>`${xs(t)},${ys(v)}`).join(' ')}"/>`+
    s.G.slice(1,E+1).map((gg,i)=>gg>s.G[i]?`<circle class="pt" cx="${xs(i+1)}" cy="${ys(s.W[i+1])}" r="4.5" fill="var(--surface)" stroke="${o.col}" stroke-width="2" data-tip="${tipTxt(o,s,i+1)}"/>`:'').join('')+
    `<circle class="pt" cx="${xs(E)}" cy="${ys(s.W[E])}" r="4.5" fill="${o.col}" data-tip="${tipTxt(o,s,E)}"/>`;}).join('');
  // 마우스를 올리면 연봉이 보이도록 연도마다 보이지 않는 점(히트 영역)
  const hits=series.map(o=>{const s=o.s;return s.W.slice(0,E+1).map((v,t)=>`<circle class="hit" cx="${xs(t)}" cy="${ys(v)}" r="7" fill="transparent" data-tip="${tipTxt(o,s,t)}"/>`).join('');}).join('');
  function tipTxt(o,s,t){const up=t>0&&s.G[t]>s.G[t-1];return esc(`${o.l} · ${age0+t}세(${String((+c.baseYear||BASE_YEAR)+t).slice(2)}년) · G${s.G[t]}${up?' 승진':''}|${fM(s.W[t])}만원`);}
  return`<h2>${esc(r.p.name)} · 연도별 연봉 추이 <span class="sub">(만원, ○ = 승진 · 점에 마우스를 올리면 연봉 표시)</span></h2>
   <div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="연도별 연봉 추이">${g}${lines}${hits}</svg></div>
   <div class="legend">${series.map(o=>`<span style="${o.hl?'font-weight:700;color:var(--accent)':''}"><i style="background:${o.col}"></i>${o.l}${o.hl?' ★':''}</span>`).join('')}</div>`;
}

/* =========================================================
   4-2. 2차 분류 (최종) — 1차 확정 직급 + 년차
   2차 기준연봉 = ① 분류 기준 하한(1년차) × (1+상승률)^(년차−1) · 상한(CAP) 없이 계속 오름
   ========================================================= */
const stepRate=c=>+((c.step||{}).rate)||0;
const stepN=c=>Math.max(1,Math.round(+((c.step||{}).years)||30));
const T2=(c,g,y)=>c.bands[g-1][0]*1e4*Math.pow(1+stepRate(c),Math.max(1,y)-1);
function autoStep(sal,g,c){if(!sal||!g)return null;const b=c.bands[g-1][0]*1e4,r=stepRate(c),N=stepN(c);
  if(sal<b)return{y:1,under:true};let y=r>0?Math.floor(Math.log(sal/b)/Math.log(1+r)+1e-9)+1:1;return y>N?{y:N,over:true,raw:y}:{y};}

// 진급 기준 (승진 시기 · 진급 시 연봉 인상) — 1차 · 2차 생애연봉 공통 수정 패널
function promo2(c){const d=+(stepRate(c)*100).toFixed(3);const o=c.promo2||{};return{rate:[0,1,2].map(i=>o.rate&&o.rate[i]!==''&&o.rate[i]!=null?+o.rate[i]:d),amt:[0,1,2].map(i=>o.amt?+o.amt[i]||0:0)};}
function promoPanelHTML(c,id){const P=promo2(c);const inp=(k,v,st)=>`<input type="number" ${st?`step="${st}"`:''} data-pc="${k}" value="${v}">`;
  return`<div class="panel" style="margin-top:16px" id="${id||'promo-crit'}"><h2>진급 기준 · 진급 시 연봉 인상 <span class="sub">(노란색 수정 가능 · 수정 즉시 1차 · 2차 생애연봉에 반영)</span></h2>
   <div class="scroll"><table class="crit-tbl"><thead><tr><th rowspan="2">구분</th><th rowspan="2">승진 기준 연수<br>(체류)</th><th>1차 생애연봉</th><th colspan="3">2차 생애연봉</th></tr>
    <tr><th>승진 정액(만원)</th><th>진급 인상률(%)</th><th>진급 정액(만원)</th><th>진급 연봉 (예: 전년 6,000만원)</th></tr></thead><tbody>
    ${['G1 → G2 진급','G2 → G3 진급','G3 → G4 진급'].map((l,i)=>{const tg=6000*(1+P.rate[i]/100)+P.amt[i];
      return`<tr><td class="l"><b>${l}</b></td><td class="in">${inp(`stay.${i}.0`,c.stay[i][0])}</td><td class="in">${inp(`promo.${i}`,c.promo[i])}</td><td class="in">${inp(`p2rate.${i}`,P.rate[i],'0.1')}</td><td class="in">${inp(`p2amt.${i}`,P.amt[i])}</td>
       <td class="l">${nf(Math.round(tg))}만원 이상 → G${i+2} 기준연봉표에서 이 금액 이상인 첫 년차로 배치</td></tr>`;}).join('')}</tbody></table></div>
   <p class="note">※ 1차: 진급 연도 연봉 = 전년 × (1+${(c.rate*100).toFixed(1)}%) + 승진 정액 / 2차: 진급 연봉 = 전년 × (1+진급 인상률) + 진급 정액 이상인 새 직급 첫 년차 (기본 인상률 = 2차 연 상승률 ${(stepRate(c)*100).toFixed(1)}%, 정액 0)</p>
   <p class="note">※ 승진 시기 = 승진 기준 연수 + ⑧ 인사평가별 누락 지연 · 최초 승진 가능 ${c.firstYear}년 (분류 기준 › 1차 분류 기준 ④·⑧)</p></div>`;}
function bindPromo(body,redraw){body.querySelectorAll('[data-pc]').forEach(el=>el.onchange=()=>{const c=S.crit;const [a,i]=el.dataset.pc.split('.');
  if(a==='p2rate'||a==='p2amt'){const P=promo2(c);c.promo2={rate:P.rate.slice(),amt:P.amt.slice()};if(a==='p2rate')c.promo2.rate[+i]=el.value===''?'':+el.value;else c.promo2.amt[+i]=Math.max(0,+el.value||0);}
  else{setCrit(el.dataset.pc,el.value);if(a==='stay')c.stay[+i][0]=Math.max(1,+c.stay[+i][0]||1);}
  save();const y=window.scrollY;redraw();window.scrollTo(0,y);toast('진급 기준을 바꿨습니다. 1차 · 2차 생애연봉이 다시 계산됩니다.');});}
// 2차 생애연봉: 매년 년차 +1 (기준연봉표 값), 승진 시 새 직급에서 「전년 × (1+상승률)」 이상인 첫 년차로 배치
function scenario2(p,g,n,c,ev,noPromo){
  const sal=num(p.salary);const F=remYears(p,c)??0;const E=evalInfo(c,ev===undefined?p.eval:ev);const kx=E.kx;const PR=promo2(c);
  const first=(+c.firstYear||0)-(+c.baseYear||0);
  const d1=(g>=4||noPromo)?999:Math.max(first,(c.mode==='현 시점부터 기준연수'?stayYears(c,g):Math.max(stayYears(c,g)-n,0)+1))+kx;
  const d2=(g>=3||noPromo)?999:d1+stayYears(c,g+1)+kx;
  const d3=(g>=2||noPromo)?999:d2+stayYears(c,g+2)+kx;
  const top=Math.max(g,E.ky);const gr=t=>Math.min(top,g+(t>=d1)+(t>=d2)+(t>=d3));const D=[d1,d2,d3];
  const end=F+1;const G=[],Y=[],W=[];let y=n;
  for(let t=0;t<=45;t++){
    if(t>end){G[t]=G[t-1];Y[t]=Y[t-1];W[t]=W[t-1];continue;}
    G[t]=gr(t);const prev=t===0?sal:W[t-1];
    if(t>0&&G[t]>G[t-1]){const tg=prev*(1+PR.rate[G[t]-2]/100)+PR.amt[G[t]-2]*1e4;y=1;let guard=0;while(T2(c,G[t],y)<tg&&guard++<200)y++;}
    else y=t===0?n:y+1;
    Y[t]=y;W[t]=t===0?sal:Math.max(prev,T2(c,G[t],y));} // 26년 = 현재 연봉·현재 년차, 27년부터 년차 +1 · 기준연봉이 현 연봉보다 낮으면 삭감 없이 유지
  const fi=Math.min(end,45);const age=num(p.age)||0;
  let path;
  if(noPromo)path=`승진 없음 · G${g} 년차만 상승 (${n}년차 → ${Y[fi]}년차)`;
  else if(g>=4)path=`최고 직급 · 년차만 상승 (${Y[fi]}년차)`;
  else{const parts=[];D.forEach((d,k)=>{if(d<=end&&g+k+1<=top)parts.push(`${age-1+d}세 G${g+k+1}·${Y[d]}년차${kx>0?`(누락 ${kx}년)`:''}`);});path=parts.length?parts.join(' → '):'승진 없음(정년 도달)';}
  const missAt=t=>!noPromo&&kx>0&&D.some((d,k)=>t>=d-kx&&t<d&&g+k+1<=top);
  const final=W[fi];const cagr=sal>0?Math.pow(final/sal,1/Math.max(1,end))-1:null;
  return{g,n,d:D,G,Y,W,final,finalG:G[fi],finalY:Y[fi],path,F,end,cagr,kx,ky:E.ky,ev:E.label,missAt,cap:false,noPromo:!!noPromo};
}

// 화면 표 → 엑셀 (정렬·필터·검색 반영)
function tableBookOld(id,sheet){const wb=XLSX.utils.book_new();const tbl=document.getElementById(id);const hr=tbl.tHead.rows[tbl.tHead.rows.length-1];
  const idx=[...hr.cells].map((th,i)=>(th.hasAttribute('data-nosort')&&!th.textContent.trim())||th.classList.contains('col-hid')?-1:i).filter(i=>i>=0);
  const head=idx.map(i=>hr.cells[i].innerHTML.replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/[▾▲▼]/g,'').replace(/\s+/g,' ').trim());
  const rows=[...tbl.tBodies[0].rows].filter(r=>!r.hidden&&r.cells.length>1).map(r=>idx.map(i=>{const td=r.cells[i];const s=cellText(td);if(/사번/.test(head[idx.indexOf(i)]))return s;const v=sortVal(td);return typeof v==='number'&&/^[-\d,.%]+$/.test(s)?(s.endsWith('%')?v/100:v):s;}));
  const money=head.map((h,i)=>/연봉|원\)|기준연봉/.test(h)?i:-1).filter(i=>i>=0);
  XLSX.utils.book_append_sheet(wb,sheetFromAoa([head,...rows],head.map(h=>Math.max(9,Math.min(22,h.length*1.6))),money),sheet);return wb;}

  // 시작 직급을 고르면 년차는 현 연봉에 맞는 년차로 자동 맞춤 (연봉이 내려가지 않게)
  g.onchange=()=>{if(g.value){const {c,rows}=computeAll();const r=rows.find(x=>pkey(x.p)===S.sel);const gg=+g.value.replace('C','');const a=r?autoStep(r.sal,gg,c):null;if(a)y.value=String(a.y);}go();};y.onchange=()=>{if(g.value)go();};}
function s2Scenarios(r,c){if(!r||!r.sal||!r.app||!r.step)return[];const L=[{lbl:'① 승진 반영',s:scenario2(r.p,r.app,r.step,c),col:'var(--accent)',hl:true},{lbl:'② 승진 없음 (년차만 상승)',s:scenario2(r.p,r.app,r.step,c,undefined,true),col:'var(--warn)'}];
  const m=man2Sel();if(m){const s=m.cap?scenario2Cap(r.p,m.g,m.y,c):scenario2(r.p,m.g,m.y,c);s.manual=true;L.push({lbl:m.cap?`③ 수기 (G${m.g}-CAP · ${m.y}년차)`:`③ 수기 (G${m.g}·${m.y}년차)`,s,col:'var(--crit)',man:true,hl:true});}return L;}
// 2차 CAP: 승진 없이 년차만 오르되 G 밴드 상한에서 동결 (이미 상한 이상이면 현 연봉 동결)
function scenario2Cap(p,g,n,c){const s=scenario2(p,g,n,c,undefined,true);const MX=c.bands[g-1][1]*1e4;const sal=num(p.salary);
  for(let t=1;t<s.W.length;t++){const prev=s.W[t-1];s.W[t]=prev>=MX?prev:Math.min(MX,Math.max(prev,s.W[t]));} // 삭감 없음
  const fi=Math.min(s.end,45);s.final=s.W[fi];s.cap=true;const age=num(p.age)||0;const tc=s.W.findIndex((v,t)=>t<=s.end&&v>=MX);
  s.path=sal>=MX?`현재 이미 상한 이상 → ${fM(sal)}만원 동결 (승진 없음)`:tc>=0?`${age-1+tc}세 G${g} 상한 ${nf(c.bands[g-1][1])}만원 도달 → 동결 (승진 없음)`:`정년까지 G${g} 상한 미도달 (승진 없음)`;
  s.cagr=sal>0?Math.pow(s.final/sal,1/Math.max(1,s.end))-1:null;return s;}

// 판정 5단계(밴드 안 위치 0~100%) + 하한 미달
const YS={exit:{l:'이탈',c:'over',o:0},soon:{l:'이탈 임박',c:'soon',o:1},high:{l:'이탈 다소 높음',c:'watch',o:2},under:{l:'하한 미달',c:'under',o:3},ok:{l:'안정적',c:'ok',o:4},vsafe:{l:'매우 안정적',c:'vsafe',o:5},ret:{l:'정년 이후',c:'ret',o:9}};
const YKEYS=['vsafe','ok','high','soon','exit','under'];
const YCOL={exit:'var(--crit)',soon:'var(--warn)',high:'var(--care)',under:'var(--under)',ok:'var(--ok)',vsafe:'var(--vsafe)'};
function yStatus(pr,an){return pr>1?'exit':pr>=an.th2/100?'soon':pr>=an.th1/100?'high':pr>=an.th0/100?'ok':pr>=0?'vsafe':'under';}
function anBandGrade(r,basis){if(r.fin)return r.fin;if(!r.k)return null;if(r.k==='밴드 미달')return 1;if(r.k==='밴드 초과')return 4;if(r.k.includes(','))return basis==='upper'?r.g2:r.g1;return r.g1;}
function quart(pr){return pr<0.25?0:pr<0.5?1:pr<0.75?2:3;}
function project(r,c,an,scen,tab){
  const st2=S.anStage==='2'&&r.app&&r.step;
  const g0=st2?r.app:anBandGrade(r,an.basis);
  // 1차: 승진 경로 = ① 생애연봉 엔진 / 2차: 2차 기준연봉표 경로(1차 확정 직급·2차 년차). t=0 → 2026
  const p2=st2?scenario2(r.p,g0,r.step,c,undefined,an.promo===false):null;
  const path=p2||(an.promo!==false&&tab?scenario(r.p,g0,c,tab):null);
  const gAt=t=>path?path.G[Math.min(t,45)]:g0;
  const H=+an.horizon,br=(+an.bandRate||0)/100;
  const R=r.rem!=null?r.rem+1:null;            // 만 정년 도달 연도(나이는 2027년 기준) → 2026+R
  const L=Math.min(45,Math.max(H,10,R??H));
  const band=(gg,t)=>{const f=Math.pow(1+br,t);return[c.bands[gg-1][0]*1e4*f,c.bands[gg-1][1]*1e4*f];};
  const [mn0,mx0]=band(g0,0);
  const pts=[{t:0,g:g0,s:r.sal,mn:mn0,mx:mx0,rate:0,promo:false,sc:r.sal}];let s=r.sal,sc=r.sal,exitT=null;
  for(let t=1;t<=L;t++){const p=pts[t-1];const pr=(p.s-p.mn)/(p.mx-p.mn);const gg=gAt(t);const promo=gg>p.g;
    const base=(an.byGrade?+an.gRates[gg-1]:+an.rate)||0;const rt=base+(scen==='B'?(+an.qadj[quart(pr)]||0):0);
    const add=promo&&!p2?(+c.promo[gg-2]||0)*1e4:0;const prevS=s;s=p2?p2.W[Math.min(t,45)]:s*(1+rt/100)+add;const [mn,mx]=band(gg,t);
    // 상한 동결 계열: 상한 미만이면 상한까지만, 이미 상한 이상이면 그 금액 유지
    sc=sc>=mx?sc:Math.min(mx,p2?Math.max(sc,s):sc*(1+rt/100)+add);
    pts.push({t,g:gg,s,mn,mx,rate:p2?(s/prevS-1)*100:rt,promo,sc,y:p2?p2.Y[Math.min(t,45)]:null});
    if(exitT==null&&(R==null||t<=R)&&s>mx&&r.sal<=mx0)exitT=t;}
  pts.forEach(p=>{p.pr=(p.s-p.mn)/(p.mx-p.mn);p.st=(R!=null&&p.t>R)?'ret':yStatus(p.pr,an);});
  const upto=Math.min(H,R??H);let worst='vsafe';for(let t=0;t<=upto;t++){if(YS[pts[t].st].o<YS[worst].o)worst=pts[t].st;}
  const promoYears=pts.filter(p=>p.promo&&p.t<=upto).map(p=>p.t);
  let ret=null;if(R!=null){const q=pts[Math.min(R,45)];
    if(an.retCap!==false){const pr=(q.sc-q.mn)/(q.mx-q.mn);ret={...q,s:q.sc,pr,st:yStatus(pr,an),frozen:q.sc>=q.mx};}else ret={...q,st:yStatus(q.pr,an)};}
  return{r,g:g0,mn0,mx0,mid0:(mn0+mx0)/2,pr0:pts[0].pr,compa:r.sal/((mn0+mx0)/2),pts,exitT,sH:pts[H].s,prH:pts[H].pr,st:worst,rt:R,ret,promoYears,gH:pts[H].g};
}
function analyze(scen){const all=computeAll();const list=all.rows.filter(r=>r.sal&&r.k).map(r=>project(r,all.c,S.an,scen,all.tab));return{...all,list};}
function summarize(list,an){
  const n=list.length,H=+an.horizon;const inB=p=>p.s>=p.mn&&p.s<=p.mx;
  const cnt=k=>list.filter(x=>x.st===k).length;
  return{n,inBand0:list.filter(x=>inB(x.pts[0])).length,inBandH:list.filter(x=>inB(x.pts[H])).length,
    exit:cnt('exit'),soon:cnt('soon'),high:cnt('high'),under:cnt('under'),ok:cnt('ok'),vsafe:cnt('vsafe'),
    underCost:list.reduce((a,x)=>a+Math.max(0,x.mn0-x.r.sal),0),
    pay0:list.reduce((a,x)=>a+x.r.sal,0),pay1:list.reduce((a,x)=>a+x.pts[1].s,0),payH:list.reduce((a,x)=>a+x.sH,0),
    retExit:list.filter(x=>x.ret&&x.ret.pr>1.000001).length,retFrozen:list.filter(x=>x.ret&&x.ret.frozen).length,promoN:list.filter(x=>x.promoYears.length).length,compa:n?list.reduce((a,x)=>a+x.compa,0)/n:null};
}
// 참고: 기존 Pay-band 현직급별 기준 금액(원) — 다른 화면과 연동하지 않는 고정 참고값
const OLD_PB={G1:40000000,G2:48300000,G3:54200000,G4:60000000,G5:67100000,G6:75800000};
// 기존 밴드(참고): Min = 현직급 기준 금액, Max = 상위 직급 기준 금액, Mid = 중간값
// G6 은 상위 직급이 없어 상한 확인 필요 → 직전 구간 폭(G6−G5)을 더한 값으로 가정 표시
function oldBand(grade){const ks=Object.keys(OLD_PB);const i=ks.indexOf(grade);if(i<0)return null;const mn=OLD_PB[ks[i]];
  const assumed=i===ks.length-1;const mx=assumed?mn+(mn-OLD_PB[ks[i-1]]):OLD_PB[ks[i+1]];return{mn,mx,md:(mn+mx)/2,assumed};}
function oldBar(sal,grade){ // 기존 직급 사다리(G1~G6) 위 현재 연봉 위치
  const W=220,H=34,pad=10,lo=36000000,hi=84000000;const X=v=>pad+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W-2*pad);
  const ks=Object.keys(OLD_PB);
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="기존 Pay-band 위치">
   <line x1="${X(OLD_PB.G1)}" x2="${X(OLD_PB.G6)}" y1="14" y2="14" stroke="var(--line-2)" stroke-width="6" stroke-linecap="round"/>
   ${ks.map(k=>{const on=k===grade;return`<line x1="${X(OLD_PB[k])}" x2="${X(OLD_PB[k])}" y1="${on?5:9}" y2="${on?23:19}" stroke="${on?'var(--navy)':'var(--muted)'}" stroke-width="${on?2.5:1}"/><text x="${X(OLD_PB[k])}" y="32" text-anchor="middle" style="font-size:9px;${on?'font-weight:800;fill:var(--navy)':''}">${k}</text>`;}).join('')}
   ${sal>hi?`<text x="${W-1}" y="18" text-anchor="end" style="fill:var(--crit);font-size:11px">▶</text>`:''}
   <circle cx="${X(sal)}" cy="14" r="4.5" fill="var(--warn)" stroke="var(--surface)" stroke-width="1.5"/></svg>`;}
function posBar(p0,pH,midPr,col,label){ // Min-Mid-Max 막대, ● 현재 / ○ 미래
  const W=200,H=34,pad=8;const lo=-0.35,hi=1.35;const X=v=>pad+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W-2*pad);
  const arrow=v=>v>hi?`<text x="${W-2}" y="19" text-anchor="end" style="fill:var(--crit);font-size:11px">▶</text>`:v<lo?`<text x="2" y="19" style="fill:var(--under);font-size:11px">◀</text>`:'';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">
   <line x1="${pad}" x2="${W-pad}" y1="15" y2="15" stroke="var(--line-2)"/>
   <rect x="${X(0)}" y="9" width="${X(1)-X(0)}" height="12" rx="3" fill="var(--surface-2)" stroke="var(--line-2)"/>

   <text x="${X(0)}" y="32" text-anchor="middle">Min</text><text x="${X(midPr)}" y="32" text-anchor="middle">Mid</text><text x="${X(1)}" y="32" text-anchor="middle">Max</text></svg>`;
}

    const p=`M${cx+R*Math.cos(a)},${cy+R*Math.sin(a)} A${R},${R} 0 ${large} 1 ${cx+R*Math.cos(a2)},${cy+R*Math.sin(a2)} L${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} A${r},${r} 0 ${large} 0 ${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}Z`;a=a2+1e-6;
    return`<path d="${p}" fill="${col}"><title>${n} ${v}명</title></path>`;}).join('');

}

function lbWageChart(WG){
  if(!WG.length)return'';const W=520,H=230,L=52,R=34,T=14,B=30;const n=WG.length;const xs=i=>L+(n>1?i/(n-1):0)*(W-L-R);
  const all=WG.flatMap(w=>[w.top,w.med,w.us]).filter(v=>v!=null);const lo=Math.min(...all)*0.92,hi=Math.max(...all)*1.04;const ys=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end">${Math.round(v).toLocaleString('ko-KR')}</text>`;}
  WG.forEach((w,i)=>g+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle">${w.yr}년차</text>`);

  const band=`<polygon fill="var(--accent-soft)" points="${WG.map((w,i)=>`${xs(i)},${ys(w.med)}`).join(' ')} ${WG.slice().reverse().map((w,i)=>`${xs(n-1-i)},${ys(w.us)}`).join(' ')}"/>`;
  const lines=S.map(([k,l,col])=>`<polyline fill="none" stroke="${col}" stroke-width="${k==='us'?3:2}" points="${WG.map((w,i)=>`${xs(i)},${ys(w[k])}`).join(' ')}"/>`+WG.map((w,i)=>`<circle cx="${xs(i)}" cy="${ys(w[k])}" r="3.5" fill="${col}"/><circle class="hit" cx="${xs(i)}" cy="${ys(w[k])}" r="8" fill="transparent" data-tip="${l} · ${w.yr}년차|${Math.round(w[k]).toLocaleString('ko-KR')}만원"/>`).join('')).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="년차별 임금 비교">${g}${band}${lines}</svg>
   <div class="legend">${S.map(([,l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}<span><i style="background:var(--accent-soft)"></i>당사–업계 중앙값 격차</span></div>`;

function lbScorecard(C){

    const vals=rows.map(r=>lbKpiVal(C,r,kp)).filter(x=>x!=null);const rk=rankOf(vals,v,kp.dir!==-1);const n=vals.length;
    let cls='hm';if(kp.dir!==0){const t=(rk-1)/(Math.max(n-1,1));cls+=t<=1/3?' good':t>=2/3?' bad':' mid';}else cls+=' neu';

   <div><h3>업계 벤치마크 스코어카드</h3>${tbl}<div class="legend"><span><i class="hmk good"></i>상위 1/3</span><span><i class="hmk mid"></i>중위</span><span><i class="hmk bad"></i>하위 1/3</span><span><i class="hmk neu"></i>참고 지표(방향 없음)</span><span>칸 아래 숫자 = 순위/비교사 수</span></div></div></div>`};

  const tbl=(n)=>{const a=sheet(n);if(!a||!a.length)return[];const hd=a[0].map(nz);const map=LB_TBL[n].map(([k,l])=>[k,hd.indexOf(nz(l))]);

  return{meta,fin,org,sales:tbl('영업').filter(r=>r.n),br:tbl('지점').filter(r=>r.n),newHire,wage:tbl('년차별임금').filter(r=>r.yr!=null),site:tbl('사업장별_인건비').filter(r=>r.n),

function importWorkbookOld(wb,fname){

  const finOf=v=>{const s=String(v??'').trim().toUpperCase();return /^G[1-4]$/.test(s)?s:'';};
  for(let r=2;r<=Math.min(rng.e.r+1,1000);r++){const g=col=>cell(col+r);if(g('B')==null||String(g('B')).trim()==='')continue;
    const bRaw=birthCol?g(birthCol):(isBirthLike(g('C'))?g('C'):null);
    people.push({id:String(g('A')??''),name:String(g('B')).trim(),birth:normBirth(bRaw),age:normBirth(bRaw)?'':(num(g('C'))??''),dept:g('D')??'',job:g('E')??'',title:g('F')??'',grade:String(g('G')??'').trim(),
      hire:g('H') instanceof Date?dateStr(g('H')):(g('H')??''),gdate:g('J') instanceof Date?dateStr(g('J')):(g('J')??''),period:g('K')??'',adj:g('L')??'',salary:num(g('M'))??'',final:finCol?finOf(g(finCol)):'',finalAuto:false,eval:evOfCell(g('O')),step:stepCol&&num(g(stepCol))?Math.round(num(g(stepCol))):''});}

  [4,5,6,7].forEach((r,i)=>{if(n('Q'+r)!=null)c.bands[i][0]=n('Q'+r);if(n('R'+r)!=null)c.bands[i][1]=n('R'+r);});
  [11,12,13].forEach((r,i)=>{if(n('Q'+r)!=null)c.overlaps[i][0]=n('Q'+r);if(n('R'+r)!=null)c.overlaps[i][1]=n('R'+r);});
  if(n('V4')!=null)c.retAge=n('V4');
  [33,34,35].forEach((r,i)=>{if(n('Q'+r)!=null)c.stay[i][0]=n('Q'+r);if(n('R'+r)!=null)c.stay[i][1]=n('R'+r);});
  if(n('Q36')!=null)c.rate=n('Q36');
  if(cc('Q37'))c.mode=String(cc('Q37'));
  [33,34,35].forEach((r,i)=>{if(n('T'+r)!=null)c.promo[i]=n('T'+r);});            // ④ 승진 정액
  if(n('V33')!=null)c.firstYear=n('V33');if(n('W33')!=null)c.baseYear=n('W33');  // 최초 승진 가능 연도 / 현 연봉 기준연도
  const gs=v=>{const s=String(v??'').trim().toUpperCase();return /^G[1-4]$/.test(s)?s:'';};
  if(cc('P55')!=null||cc('P57')!=null)GRADE6.forEach((g,i)=>{c.target[g]=['Q','R','S'].map(cl=>gs(cc(cl+(57+i))));}); // ⑦
  if(cc('P67')!=null)EVALS.forEach((e,i)=>{const q=n('Q'+(67+i)),rr=gs(cc('R'+(67+i)));c.evalTbl[e]=[q??0,rr||'G4'];}); // ⑧

if(document.getElementById('btn-paste'))document.getElementById('btn-paste').onclick=()=>{const box=document.getElementById('dlg-box');
  box.innerHTML=`<div class="hd"><h2 style="margin:0">엑셀에서 붙여넣기</h2><button type="button" id="dlg-close">닫기</button></div>
  <p class="sub">기본정보 시트의 A~M열(사번 · 이름 · 나이 · 부서 · 직군 · 직책 · 현직급 · 입사년도 · 남은정년 · 발령일 · 기간 · 조정 · 현 연봉)을 머리글 없이 복사해 붙여넣으세요. C열에 나이 대신 생년월일(1990-03-15, 19900315, 900315)을 넣어도 됩니다. N열(분류 직급) 다음 O열 인사평가(S·A+·A·B·C), P열 최종 분류 직급(G1~G4)이 있으면 함께 읽습니다. 분류 기준은 지금 값을 유지합니다.</p>
  <textarea id="paste-ta" placeholder="218012	홍길동	34	작물보호팀	일반직	담당	G2	2018-05-02		2022-10-01	4년3월		52171690"></textarea>
  <div class="bar" style="margin-top:8px"><span class="grow"></span><button type="button" id="paste-cancel">취소</button><button type="button" class="primary" id="paste-ok">인원 교체</button></div>`;
  const d=document.getElementById('dlg');d.hidden=false;const close=()=>d.hidden=true;box.querySelector('#dlg-close').onclick=close;box.querySelector('#paste-cancel').onclick=close;
  box.querySelector('#paste-ta').focus();
  box.querySelector('#paste-ok').onclick=()=>{const txt=box.querySelector('#paste-ta').value;const rows=txt.split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.length>=2&&c[1].trim()!==''&&c[1].trim()!=='이름');
    if(!rows.length){toast('붙여넣은 행이 없습니다. 탭으로 구분된 엑셀 행을 넣으세요.');return;}
    const dt=v=>String(v||'').trim().replace(/\./g,'-').replace(/-$/,'');
    S.people=rows.map(c=>({id:c[0]?.trim()||'',name:c[1].trim(),birth:normBirth(isBirthLike(c[2])?c[2]:c[16]),age:isBirthLike(c[2])?'':(num(c[2])??''),dept:c[3]?.trim()||'',job:c[4]?.trim()||'',title:c[5]?.trim()||'',grade:c[6]?.trim()||'',hire:dt(c[7]),gdate:dt(c[9]),period:c[10]?.trim()||'',adj:c[11]?.trim()||'',salary:num(c[12])??'',finalAuto:false,...pasteTail(c)}));
    S.source='file';S.sourceName='붙여넣기';S.sel='';save();close();route();toast(`${S.people.length}명을 불러왔습니다.`);};};
// 붙여넣기 O열 이후: 인사평가(O) · 최종 분류 직급(P). 예전 형식(O열 = 최종 직급)도 받는다.
function pasteTail(c){const u=i=>String(c[i]||'').trim().toUpperCase();
  if(/^G[1-4]$/.test(u(14)))return{final:u(14),eval:''};
  return{eval:EVALS.includes(u(14))?u(14):'',final:/^G[1-4]$/.test(u(15))?u(15):''};}
let resetArmed=false;
document.getElementById('btn-reset').onclick=e=>{const b=e.currentTarget;if(!resetArmed){resetArmed=true;b.textContent='한 번 더 누르면 초기화';b.classList.add('primary');setTimeout(()=>{resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');},3000);return;}
  resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');S=fresh();save();route();toast('예시 데이터로 되돌렸습니다.');};

function route(){
  document.getElementById('view-payband').hidden=false;['analysis','labor'].forEach(k=>{const v=document.getElementById('view-'+k);if(v)v.hidden=true;});
  const b=document.getElementById('srcbadge');const n=S.people.filter(p=>String(p.name||'').trim()).length;
  b.textContent=S.source==='demo'?`예시 데이터 · ${n}명 (가상 인원)`:`${S.sourceName||'불러온 데이터'} · ${n}명`;b.classList.toggle('real',S.source!=='demo');
  renderPayband();
}

route();
