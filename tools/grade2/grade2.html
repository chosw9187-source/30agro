  --input:#4a4318; --stay:#3a3519; --cap:#5a3a22; --ovr:#1d3a52; --ov12:#1f4a2c; --ov23:#1f3a55; --ov34:#5a3624; --cell-ink:#e4ece7;
  --crit:#ff7b6b; --crit-soft:#46201b; --warn:#f2a256; --warn-soft:#432d16; --care:#e3c75a; --care-soft:#3a3315;
  --ok:#5fcf8f; --ok-soft:#173826; --under:#7fb1f0; --under-soft:#1a2c46; --hl:rgba(242,162,86,.16); --vsafe:#6cc3e0; --vsafe-soft:#14313b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1d2722; --ink:#e4ece7; --muted:#97a69e; --line:#2a3630; --line-2:#3a4942;
  --accent:#3fb877; --accent-ink:#06130c; --accent-soft:#183326; --navy:#9cc2ea;
  --input:#4a4318; --stay:#3a3519; --cap:#5a3a22; --ovr:#1d3a52; --ov12:#1f4a2c; --ov23:#1f3a55; --ov34:#5a3624; --cell-ink:#e4ece7;

*{box-sizing:border-box}

.curcol{background:var(--surface-2)!important;color:var(--muted)}

.scale{display:flex;border-radius:6px;overflow:hidden;margin-top:8px;font-size:11px;color:#fff;text-align:center}
.scale span{padding:4px 2px;min-width:0;line-height:1.25} .scale b{display:block;font-size:11px}
.gtag{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}

.itip h4{margin:0 0 6px;font-size:13px;color:var(--navy)} .itip table{width:100%;border-collapse:collapse;margin:4px 0} .itip td,.itip th{border:1px solid var(--line);padding:3px 6px;text-align:left;font-size:11.5px;white-space:normal;word-break:keep-all} .itip th{background:var(--surface-2);font-weight:700}

.note.cap{margin:0 0 4px;height:18px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

table.info{font-size:12.5px} table.info th{font-size:11.5px;padding:3px 2px;padding-right:18px} table.info td{padding:2px 3px}

textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line-2);border-radius:var(--r);padding:8px;background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.mini-sel{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--input);color:var(--cell-ink)}
.statbar{display:flex;flex-direction:column;gap:6px}
.statbar .row{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12px}
.statbar .track{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.statbar .track span{display:block;height:100%}
#cur-tbl th.pos-new{border-left:3px solid var(--accent)!important;border-right:3px solid var(--accent)!important;border-top:3px solid var(--accent)!important;background:var(--accent);color:var(--accent-ink)}
#cur-tbl td.pos-new{border-left:3px solid var(--accent)!important;border-right:3px solid var(--accent)!important}
#cur-tbl tbody tr:last-child td.pos-new{border-bottom:3px solid var(--accent)!important}
#cur-tbl th.pos-old{background:var(--surface-2);color:var(--muted)} #cur-tbl td.pos-old{background:var(--surface);opacity:.92}
#cur-tbl .oldtxt{font-size:11px;color:var(--muted);text-align:center;margin-top:-2px} #cur-tbl .oldtxt .up{color:var(--warn)} #cur-tbl .oldtxt .dn{color:var(--under)} #cur-tbl .oldtxt .asm{color:var(--crit)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---- 직급 분류(신규 기준) 전용 ---- */
.g2-crit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.g2-crit td.l{white-space:normal;word-break:keep-all;font-size:11.5px;line-height:1.35;text-align:left} .g2-crit td.in select{min-width:62px}
@media (max-width:1300px){.g2-crit{grid-template-columns:repeat(3,minmax(0,1fr))}} @media (max-width:800px){.g2-crit{grid-template-columns:1fr}}
.g2-crit .panel,.g2-sum .panel{margin:0} .g2-crit .crit-tbl{width:100%} .g2-crit select{width:100%}
.g2-sum{display:grid;grid-template-columns:1.2fr 1fr 1.3fr;gap:12px;margin-top:12px;align-items:start} @media (max-width:1100px){.g2-sum{grid-template-columns:1fr}}
.rtbl{width:100%;border-collapse:collapse} .rtbl th{background:var(--navy);color:#fff;font-weight:700} .rtbl td,.rtbl th{text-align:center;padding:6px 8px;border:1px solid var(--line)} .rtbl tr.tot td{background:var(--surface-2)}
.gc1{background:var(--surface-2)!important} .gc2{background:var(--ov12)!important;color:var(--cell-ink)} .gc3{background:var(--ov23)!important;color:var(--cell-ink)} .gc4{background:var(--ov34)!important;color:var(--cell-ink)}
.g2-cls td.gv.same{color:var(--accent);font-weight:800} .g2-cls td.gv.diff{color:var(--muted)} .g2-cls td.gv.na{color:var(--muted);font-style:italic}
.g2-cls thead tr:first-child th{font-size:12px;letter-spacing:.02em} .g2-cls th.g-base{background:var(--navy)} .g2-cls th.g-ev{background:var(--accent);color:var(--accent-ink)} .g2-cls th.g-sum{background:#5b3f8c;color:#fff}
.g2-cls .ev1{border-left:3px solid var(--line-2)!important} .g2-cls td.fin select{min-width:84px} .g2-w input{width:100%}
</style>

<script>
const LS_KEY='sg30-grade2-v1';
const BASE_YEAR=2026, TODAY=new Date(2026,10,3);
const GRADE6=['G1','G2','G3','G4','G5','G6'];
const GRADE6_DESC=[...GRADE6].reverse();
const num=v=>{if(v===''||v==null)return null;const n=typeof v==='number'?v:+String(v).replace(/[,\s원]/g,'');return isFinite(n)?n:null;};
function classify(salWon,c){ // 기본정보 N열

const gN=g=>/^G[1-4]$/.test(g||'')?+g[1]:null;
function careerYears(p,c){ // 연차 = 현직급 기본연차 + 현직급 기간(년, 내림) + 조정(±년)
  const b=num((c.baseYr||{})[p.grade]);if(b==null)return null;const m=periodBaseMonths(p);const a=num(p.adj)||0;
  return Math.max(1,b+(m==null?0:Math.floor(m/12))+Math.round(a));}
function yearGrade(y,c){if(y==null)return null;const s=c.yStart;return y>=s[3]?4:y>=s[2]?3:y>=s[1]?2:1;}
function yearRange(i,c){const s=c.yStart;return i<3?`${s[i]}~${s[i+1]-1}년차`:`${s[3]}년차 이상`;}
function roleGrade(role,c){const r=(c.roles||[]).find(x=>x[0]===role);return r?gN(r[1]):null;}
function salVal(k){if(!k)return null;if(k==='밴드 미달')return 1;if(k==='밴드 초과')return 4;return CLS_RANK[k];} // 중첩 = 중간값(예: G1·G2 = 1.5)
const CRIT_N=['(1) 현직급 변환','(2) 연차','(3) 직무 역할','(4) 연봉 (Pay-band)'];
function calc(p,c){
  const sal=num(p.salary);const k=classify(sal,c);
  const yrs=careerYears(p,c);
  const v=[gN(c.gmap[p.grade]),yearGrade(yrs,c),roleGrade(p.role,c),salVal(k)];
  let sw=0,ss=0;v.forEach((x,i)=>{const w=+c.w[i]||0;if(x!=null&&w>0){sw+=w;ss+=w*x;}});
  const score=sw?ss/sw:null;const comp=score==null?null:Math.min(4,Math.max(1,Math.floor(score+0.5+1e-9)));
  const hit=i=>{const x=v[i];if(x==null||comp==null)return false;if(i===3&&k.includes(','))return k.includes('G'+comp);return Math.round(x)===comp||(i===3&&((k==='밴드 미달'&&comp===1)||(k==='밴드 초과'&&comp===4)));};
  const agree=v.filter(x=>x!=null).length?[0,1,2,3].filter(hit).length:0;const avail=v.filter(x=>x!=null).length;
  const fin=gN(p.final);return{p,sal,k,yrs,v,score,comp,agree,avail,hit,fin,app:fin||comp};}

function setCrit(path,val){const c=S.crit;const [a,i,j]=path.split('.');
  if(a==='gmap'){c.gmap[i]=val;return;}if(a==='baseYr'){c.baseYr[i]=val===''?'':+val;return;}
  if(a==='yStart'){c.yStart[+i]=Math.max(2,+val||2);return;}if(a==='roles'){c.roles[+i][1]=val;return;}
  if(a==='w'){c.w[+i]=Math.max(0,+val||0);return;}c[a][+i][+j]=+val||0;}

  const idx=[...hr.cells].map((th,i)=>th.hasAttribute('data-nosort')||th.classList.contains('col-hid')?-1:i).filter(i=>i>=0);
  const head=idx.map(i=>hr.cells[i].innerHTML.replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/[▾▲▼]/g,'').replace(/\s+/g,' ').trim());
  const rows=[...tbl.tBodies[0].rows].filter(r=>!r.hidden&&r.cells.length>1).map(r=>idx.map(i=>{const td=r.cells[i];const s=cellText(td);if(/사번/.test(head[idx.indexOf(i)]))return s;const v=sortVal(td);return typeof v==='number'&&/^[-\d,.%]+$/.test(s)?v:s;}));
  const money=head.map((h,i)=>/연봉/.test(h)?i:-1).filter(i=>i>=0);
  XLSX.utils.book_append_sheet(wb,sheetFromAoa([head,...rows],head.map(h=>Math.max(8,Math.min(20,h.length*1.6))),money),sheet);return wb;}
function importWorkbook(wb,fname){
  const ws=wb.Sheets['기본정보']||wb.Sheets[wb.SheetNames[0]];const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=A.slice(0,15).findIndex(r=>r.some(v=>String(v).replace(/\s/g,'')==='이름'));if(hi<0)throw new Error('「이름」 머리글을 찾지 못했습니다.');
  const H=A[hi].map(v=>String(v).replace(/\s/g,''));const col=f=>H.findIndex(f);
  const C={id:col(h=>h.includes('사번')),name:col(h=>h==='이름'),birth:col(h=>h.includes('생년')),age:col(h=>h==='나이'),dept:col(h=>h.includes('부서')),job:col(h=>h.includes('직군')),title:col(h=>h.includes('직책')),
    grade:col(h=>h==='현직급'),hire:col(h=>h.includes('입사')),gdate:col(h=>h.includes('발령')),period:col(h=>h.includes('기간')),adj:col(h=>h.startsWith('조정')),salary:col(h=>h.includes('연봉')&&!h.includes('분류')),
    role:col(h=>h.includes('역할')),final:col(h=>h.includes('최종'))};
  const ds=v=>v instanceof Date?dateStr(v):String(v||'').trim().replace(/\./g,'-').replace(/-$/,'');const g=(r,k)=>C[k]>=0?r[C[k]]:'';
  const roles=S.crit.roles.map(x=>x[0]);const roleOf=v=>{const s=String(v||'').replace(/\s/g,'');return roles.find(x=>x.replace(/\s/g,'')===s)||'';};
  const P=A.slice(hi+1).filter(r=>String(g(r,'name')).trim()).map(r=>({id:String(g(r,'id')).trim(),name:String(g(r,'name')).trim(),birth:normBirth(g(r,'birth')),age:num(g(r,'age'))??'',dept:String(g(r,'dept')).trim(),job:String(g(r,'job')).trim(),
    title:String(g(r,'title')).trim(),grade:String(g(r,'grade')).trim().toUpperCase(),hire:ds(g(r,'hire')),gdate:ds(g(r,'gdate')),period:g(r,'gdate')?'':String(g(r,'period')).trim(),adj:num(g(r,'adj'))??'',salary:num(g(r,'salary'))??'',
    role:roleOf(g(r,'role')),final:/^G[1-4]$/.test(String(g(r,'final')).trim().toUpperCase())?String(g(r,'final')).trim().toUpperCase():''}));
  if(!P.length)throw new Error('불러올 인원이 없습니다.');
  S.people=P;S.source='file';S.sourceName=fname;save();render();toast(`${P.length}명을 불러왔습니다.${C.role<0?' (직무 역할 열 없음 → 기본정보에서 선택)':''}`);}
document.getElementById('file-xlsx').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){toast('엑셀 해석 모듈을 불러오지 못했습니다.');return;}
  const rd=new FileReader();rd.onload=()=>{try{importWorkbook(XLSX.read(rd.result,{type:'array',cellDates:true}),f.name);}catch(err){toast(err.message);}e.target.value='';};rd.readAsArrayBuffer(f);});
let resetArmed=false;
document.getElementById('btn-reset').onclick=e=>{const b=e.currentTarget;if(!resetArmed){resetArmed=true;b.textContent='한 번 더 누르면 초기화';b.classList.add('primary');setTimeout(()=>{resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');},3000);return;}
  resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');S=fresh();save();render();toast('예시 데이터로 되돌렸습니다.');};
render();

</script>
