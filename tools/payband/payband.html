<script>
'use strict';
/* =========================================================
   0. 상태 · 저장
   ========================================================= */
const LS_KEY='sg30-payband-v1';
const BASE_YEAR=2026, TODAY=new Date(2026,10,3);
const GRADE6=['G1','G2','G3','G4','G5','G6'];
const CLASS_KEYS=['G1','G1, G2','G2','G2, G3','G3','G3, G4','G4','밴드 미달','밴드 초과'];
const OV_LABEL=['G1~G2','G2~G3','G3~G4'];

function defaultCrit(){return{
  bands:[[4000,5500],[4700,6700],[5600,8100],[6700,9900]],           // ① 직급별 Pay-band (만원)
  overlaps:[[4700,5500],[5600,6700],[6700,8100]],                     // ② 중첩 구간 (만원)
  retAge:55,                                                          // 정년 기준(만 나이)
  stay:[[4,0],[4,0],[5,0]],                                           // ④ 기준 연수 / 누락 연수
  rate:0.025,                                                         // ④ 연 상승률
  mode:'배치 연차 기준',                                               // ④ 첫 승진 시점 산정
  ovr:[Array(30).fill(''),Array(30).fill(''),Array(30).fill(''),Array(30).fill('')] // ⑥ 수기 조정 (G1..G4)
};}
function demoPeople(){
  // 가상의 예시 인원 — 실제 직원 아님
  const R=[
   [260101,'김하늘',27,'작물보호팀','일반직','담당','G1','2024-01-02','2024-01-02',41200000],
   [250314,'이준서',29,'생산팀','기술직','담당','G1','2022-03-02','2022-03-02',46800000],
   [240207,'박서연',31,'연구소','연구직','담당','G2','2019-07-01','2023-04-01',52500000],
   [230118,'최민재',33,'영업1팀','영업직','담당','G2','2018-01-02','2022-04-01',58900000],
   [220405,'정유진',35,'품질보증팀','일반직','선임','G3','2016-03-02','2021-04-01',63400000],
   [210822,'강도윤',37,'해외영업팀','영업직','선임','G3','2014-09-01','2020-04-01',69800000],
   [200310,'윤지호',39,'생산팀','기술직','선임','G3','2012-01-02','2019-04-01',57200000],
   [190527,'장수아',41,'연구소','연구직','책임','G4','2011-03-02','2018-04-01',78500000],
   [180601,'임태현',44,'경영지원팀','일반직','팀장','G5','2008-01-02','2017-04-01',92300000],
   [170211,'한예린',30,'인사팀','일반직','담당','G2','2020-07-01','2024-04-01',49900000],
   [160909,'오세훈',46,'작물보호팀','일반직','팀장','G5','2006-01-02','2016-04-01',97800000],
   [150415,'서지민',50,'생산팀','기술직','책임','G4','2002-03-02','2015-04-01',101500000],
   [140120,'신동현',28,'영업1팀','영업직','담당','G1','2023-07-03','2023-07-03',38500000],
   [130708,'권나연',34,'재무팀','일반직','담당','G2','2017-01-02','2022-04-01',61700000],
   [120330,'황민석',42,'품질보증팀','일반직','책임','G4','2010-01-04','2019-04-01',81000000],
   [110902,'안소희',36,'연구소','연구직','선임','G3','2015-03-02','2021-04-01',66200000],
   [100614,'송재원',48,'해외영업팀','영업직','팀장','G6','2004-01-02','2014-04-01',96500000],
   [ 90225,'전하은',26,'생산팀','기술직','담당','G1','2025-01-02','2025-01-02',40300000],
   [ 80117,'홍우진',38,'작물보호팀','일반직','책임','G4','2013-01-02','2020-04-01',84600000],
   [ 70823,'문서영',32,'인사팀','일반직','담당','G2','2019-01-02','2023-04-01',53800000],
   [ 60512,'배성호',52,'생산팀','기술직','팀장','G5','2000-03-02','2013-04-01',88900000],
   [ 50309,'조아라',40,'경영지원팀','일반직','책임','G4','2012-07-02','2019-04-01',72400000],
   [ 40721,'유건우',45,'연구소','연구직','수석','G6','2007-03-02','2015-04-01',99000000],
   [ 30130,'노지원',29,'재무팀','일반직','담당','G1','2022-07-01','2022-07-01',45600000]];
  return R.map(r=>({id:String(r[0]).padStart(6,'0'),name:r[1],age:r[2],dept:r[3],job:r[4],title:r[5],grade:r[6],hire:r[7],gdate:r[8],period:'',adj:'',salary:r[9]}));
}
function defaultAn(rate){return{basis:'lower',rate:rate,byGrade:false,gRates:[rate,rate,rate,rate],bandRate:0,horizon:5,warn:2,scen:'A',qadj:[1.0,0.5,0,-1.0],
  sort:{key:'risk',dir:1},f:{status:'all',grade:'all',dept:'all',q:''}};}
function fresh(){const c=defaultCrit();return{crit:c,people:demoPeople(),source:'demo',sourceName:'',sel:'',sheet:'info',an:defaultAn(+(c.rate*100).toFixed(2))};}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.crit&&Array.isArray(s.people)){const d=fresh();s.an=Object.assign(d.an,s.an||{});s.an.f=Object.assign(defaultAn(2.5).f,s.an.f||{});return s;}}catch(e){}return fresh();})();
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}

/* =========================================================
   1. 엑셀 로직 이식 (기본정보 · 계산 시트)
   ========================================================= */
const num=v=>{if(v===''||v==null)return null;const n=typeof v==='number'?v:+String(v).replace(/[,\s원]/g,'');return isFinite(n)?n:null;};
const ovW=v=>{const n=num(v);if(n==null)return null;return n<100000?n*10000:n;};
const stayYears=(c,g)=>(+c.stay[g-1][0]||0)+(+c.stay[g-1][1]||0); // g=1..3 : G g → G g+1

function classify(salWon,c){ // 기본정보 N열
  if(salWon==null)return '';
  const m=salWon/10000, o=c.overlaps, b=c.bands;
  if(m>=o[2][0]&&m<=o[2][1])return 'G3, G4';
  if(m>=o[1][0]&&m<=o[1][1])return 'G2, G3';
  if(m>=o[0][0]&&m<=o[0][1])return 'G1, G2';
  for(let i=0;i<4;i++)if(m>=b[i][0]&&m<=b[i][1])return 'G'+(i+1);
  return m<b[0][0]?'밴드 미달':'밴드 초과';
}
function classCss(k){return k==='G1, G2'?'c-ov12':k==='G2, G3'?'c-ov23':k==='G3, G4'?'c-ov34':k==='밴드 미달'?'c-under':k==='밴드 초과'?'c-over':'';}
function remYears(p,c){const a=num(p.age);return a==null?null:Math.max(c.retAge-a,0);}

function stdTable(c){ // ⑤ 직급·연차별 기준연봉표 (원), T[g][1..30]
  const T={},cls={};
  for(let g=1;g<=4;g++){const mn=c.bands[g-1][0]*10000, MX=c.bands[g-1][1]*10000;T[g]=[null];cls[g]=[null];
    for(let y=1;y<=30;y++){const o=ovW(c.ovr[g-1][y-1]);let v;
      if(o!=null)v=Math.min(MX,o);else if(y===1)v=mn;else v=Math.min(MX,T[g][y-1]*(1+c.rate));
      T[g][y]=v;
      cls[g][y]=o!=null?'c-ovr':(v>=MX?'c-cap':(g<4&&y>stayYears(c,g)?'c-stay':''));}}
  return{T,cls};
}
function scenario(p,g,c,tab){ // 계산 시트 J~DD(①) / DF~HA(②)
  const sal=num(p.salary);const F=remYears(p,c)??0;const row=tab.T[g];
  let n0=0;for(let y=1;y<=30;y++)if(row[y]<=sal)n0++;n0=Math.max(1,n0);
  const d1=g>=4?999:(c.mode==='현 시점부터 기준연수'?stayYears(c,g):Math.max(stayYears(c,g)-n0,0)+1);
  const d2=g>=3?999:d1+stayYears(c,g+1);
  const d3=g>=2?999:d2+stayYears(c,g+2);
  const gr=t=>g+(t>=d1)+(t>=d2)+(t>=d3);
  const G=[],W=[];
  for(let t=0;t<=45;t++){G[t]=gr(t);
    if(t===0){W[0]=sal;continue;}
    const prev=W[t-1];
    if(t>F){W[t]=prev;continue;}
    const gt=G[t];let idx=t>=d3?t-d3+1:t>=d2?t-d2+1:t>=d1?t-d1+1:n0+t;idx=Math.min(30,idx);
    W[t]=Math.max(prev,Math.min(c.bands[gt-1][1]*10000,Math.max(prev*(1+c.rate),tab.T[gt][idx])));}
  const fi=Math.min(F,45);const age=num(p.age);
  let path;
  if(g>=4)path='최고 직급';
  else{const parts=[];[d1,d2,d3].forEach((d,k)=>{if(d<=F&&g+k+1<=4)parts.push(`${age+d}세 G${g+k+1}`);});path=parts.length?parts.join(' → '):'승진 없음(정년 도달)';}
  const cagr=F>0&&sal>0?Math.pow(W[fi]/sal,1/F)-1:null;
  return{g,n0,d:[d1,d2,d3],G,W,final:W[fi],finalG:G[fi],path,F,cagr};
}
function computeAll(){
  const c=S.crit,tab=stdTable(c);
  const rows=S.people.filter(p=>String(p.name||'').trim()!=='').map(p=>{
    const sal=num(p.salary);const k=classify(sal,c);
    const g1=k===''?null:k==='밴드 미달'?1:k==='밴드 초과'?4:+k[1];
    const g2=k.includes(',')?+k[5]:null;
    const sc1=g1&&sal?scenario(p,g1,c,tab):null;const sc2=g2&&sal?scenario(p,g2,c,tab):null;
    const fin=/^G[1-4]$/.test(p.final||'')?+p.final[1]:null;
    return{p,sal,k,g1,g2,fin,rem:remYears(p,c),sc1,sc2};});
  return{c,tab,rows};
}

const fM=v=>v==null||!isFinite(v)?'-':Math.round(v/10000).toLocaleString('ko-KR');
const fEok=v=>v==null||!isFinite(v)?'-':(v/1e8).toFixed(1);
const fP=(v,d=1)=>v==null||!isFinite(v)?'-':(v*100).toFixed(d)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dateStr=v=>{if(!v)return'';if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;return String(v).slice(0,10).replace(/\./g,'-');};
const dotDate=v=>dateStr(v).replace(/-/g,'.');
function periodText(p){if(p.period)return p.period;const d=new Date(dateStr(p.gdate));if(isNaN(d))return'';let m=(TODAY.getFullYear()-d.getFullYear())*12+(TODAY.getMonth()-d.getMonth());if(TODAY.getDate()<d.getDate())m--;if(m<0)return'';return`${Math.floor(m/12)}년${m%12}월`;}

function lifeChart(r,c){
  const F=r.rem??0;if(!r.sc1)return'';const series=[r.sc1,r.sc2].filter(Boolean);
  const W=560,H=240,L=58,Rp=14,T=14,B=30;const xs=t=>L+(F?t/F:0)*(W-L-Rp);
  const vals=series.flatMap(s=>s.W.slice(0,F+1));const lo=Math.min(...vals)*0.95,hi=Math.max(...vals)*1.03;const ys=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
  const ticks=4;let g='';for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks;g+=`<line x1="${L}" x2="${W-Rp}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end">${fM(v)}</text>`;}
  const step=F>20?5:F>10?2:1;for(let t=0;t<=F;t+=step)g+=`<text x="${xs(t)}" y="${H-10}" text-anchor="middle">${(num(r.p.age)||0)+t}세</text>`;
  const cols=['var(--accent)','var(--warn)'];
  const lines=series.map((s,i)=>`<polyline fill="none" stroke="${cols[i]}" stroke-width="2.2" points="${s.W.slice(0,F+1).map((v,t)=>`${xs(t)},${ys(v)}`).join(' ')}"/>`+
    s.d.filter(d=>d<=F).map(d=>`<circle cx="${xs(d)}" cy="${ys(s.W[d])}" r="4" fill="var(--surface)" stroke="${cols[i]}" stroke-width="2"/>`).join('')+
    `<circle cx="${xs(F)}" cy="${ys(s.W[F])}" r="4" fill="${cols[i]}"/>`).join('');
  return`<h2>${esc(r.p.name)} · 연도별 연봉 추이 <span class="sub">(만원, ○ = 승진)</span></h2>
   <div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="연도별 연봉 추이">${g}${lines}</svg></div>
   <div class="legend"><span><i style="background:var(--accent)"></i>① 하위·단일 직급 시작</span>${r.sc2?'<span><i style="background:var(--warn)"></i>② 상위 직급 시작</span>':''}</div>`;
}

/* =========================================================
   4. 사이트 ② 임금분석 — 현재 위치 · 미래 이탈 시뮬레이션
   ========================================================= */
const ST={over:{l:'상한 초과',o:0},soon:{l:'이탈 임박',o:1},under:{l:'하한 미달',o:2},watch:{l:'이탈 예정',o:3},ok:{l:'안정',o:4}};
function anBandGrade(r,basis){if(r.fin)return r.fin;if(!r.k)return null;if(r.k==='밴드 미달')return 1;if(r.k==='밴드 초과')return 4;if(r.k.includes(','))return basis==='upper'?r.g2:r.g1;return r.g1;}
function quart(pr){return pr<0.25?0:pr<0.5?1:pr<0.75?2:3;}
function project(r,c,an,scen){
  const g=anBandGrade(r,an.basis);const mn0=c.bands[g-1][0]*1e4,mx0=c.bands[g-1][1]*1e4;
  const H=an.horizon, br=(+an.bandRate||0)/100;const base=(an.byGrade?+an.gRates[g-1]:+an.rate)||0;
  const limit=Math.max(H,Math.min(30,r.rem??30));
  const pts=[{t:0,s:r.sal,mn:mn0,mx:mx0,rate:0}];let s=r.sal,exitT=null,reachMinT=null;
  for(let t=1;t<=limit;t++){const p=pts[t-1];const pr=(p.s-p.mn)/(p.mx-p.mn);
    const rt=base+(scen==='B'?(+an.qadj[quart(pr)]||0):0);s=s*(1+rt/100);
    const f=Math.pow(1+br,t);const mn=mn0*f,mx=mx0*f;pts.push({t,s,mn,mx,rate:rt});
    const alive=r.rem==null||t<=r.rem;
    if(exitT==null&&alive&&s>mx&&r.sal<=mx0)exitT=t;
    if(reachMinT==null&&r.sal<mn0&&s>=mn)reachMinT=t;}
  const pr0=(r.sal-mn0)/(mx0-mn0);const h=pts[H];const prH=(h.s-h.mn)/(h.mx-h.mn);
  let st;if(r.sal>mx0)st='over';else if(r.sal<mn0)st='under';else if(exitT!=null&&exitT<=an.warn)st='soon';else if(exitT!=null&&exitT<=H)st='watch';else st='ok';
  const retiredBy=r.rem!=null&&r.rem<H;
  return{r,g,mn0,mx0,mid0:(mn0+mx0)/2,pr0,compa:r.sal/((mn0+mx0)/2),pts,exitT,reachMinT,sH:h.s,prH,st,retiredBy,
    inc1:pts[1].s-r.sal,incH:h.s-r.sal,headroom:mx0-r.sal};
}
function analyze(scen){const all=computeAll();const list=all.rows.filter(r=>r.sal&&r.k).map(r=>project(r,all.c,S.an,scen));return{...all,list};}
function summarize(list,an){
  const n=list.length;const inBand0=list.filter(x=>x.r.sal>=x.mn0&&x.r.sal<=x.mx0).length;
  const H=an.horizon;const inBandH=list.filter(x=>{const h=x.pts[H];return h.s>=h.mn&&h.s<=h.mx;}).length;
  const cnt=k=>list.filter(x=>x.st===k).length;
  const underCost=list.reduce((a,x)=>a+Math.max(0,x.mn0-x.r.sal),0);
  const pay0=list.reduce((a,x)=>a+x.r.sal,0),payH=list.reduce((a,x)=>a+x.sH,0),pay1=list.reduce((a,x)=>a+x.pts[1].s,0);
  const exitH=list.filter(x=>x.exitT!=null&&x.exitT<=H).length;
  return{n,inBand0,inBandH,over:cnt('over'),under:cnt('under'),soon:cnt('soon'),watch:cnt('watch'),ok:cnt('ok'),underCost,pay0,pay1,payH,exitH,
    compa:n?list.reduce((a,x)=>a+x.compa,0)/n:null};
}

  const v=document.getElementById('view-analysis');const an=S.an;
  v.innerHTML=`<h1>임금분석 · Pay-band 위치 시뮬레이션</h1>

    <div class="legend"><span><i style="background:var(--accent-soft)"></i>Pay-band (Min~Max)</span><span><i style="background:var(--muted)"></i>Mid</span><span><i style="background:var(--ink)"></i>예상 연봉 (만원)</span></div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th>연도</th><th>인상률</th><th>예상 연봉(원)</th><th>Min</th><th>Max</th><th>위치</th><th>판정</th></tr></thead><tbody>
    ${pts.map(q=>{const pr=(q.s-q.mn)/(q.mx-q.mn);const ret=x.r.rem!=null&&q.t>x.r.rem;return`<tr><td>${BASE_YEAR+q.t}${q.t===0?' (현재)':''}</td><td class="num">${q.t?q.rate.toFixed(1)+'%':'-'}</td><td class="num">${fW(q.s)}</td><td class="num">${fW(q.mn)}</td><td class="num">${fW(q.mx)}</td><td class="num">${fP(pr)}</td><td>${ret?'<span class="note" style="margin:0">정년 이후</span>':q.s>q.mx?'<span class="c-over">상한 초과</span>':q.s<q.mn?'<span class="c-under">하한 미달</span>':'밴드 내'}</td></tr>`;}).join('')}
    </tbody></table></div>`;
  const d=document.getElementById('dlg');d.hidden=false;box.querySelector('#dlg-close').onclick=()=>d.hidden=true;box.querySelector('#dlg-close').focus();
}
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.currentTarget.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('dlg').hidden=true;});
function showText(title,txt){const box=document.getElementById('dlg-box');box.innerHTML=`<div class="hd"><h2 style="margin:0">${esc(title)}</h2><button type="button" id="dlg-close">닫기</button></div><p class="sub">아래 내용을 전체 선택(Ctrl+A) 후 복사하세요.</p><textarea id="dlg-ta" readonly></textarea>`;
  box.querySelector('#dlg-ta').value=txt;const d=document.getElementById('dlg');d.hidden=false;box.querySelector('#dlg-close').onclick=()=>d.hidden=true;box.querySelector('#dlg-ta').select();}

/* =========================================================
   5. 데이터 불러오기 (엑셀 파일 / 붙여넣기)
   ========================================================= */
function importWorkbook(wb,fname){
  const ws=wb.Sheets['기본정보']||wb.Sheets[wb.SheetNames[0]];if(!ws)throw new Error('기본정보 시트를 찾지 못했습니다.');
  const cell=a=>{const c=ws[a];return c?c.v:undefined;};
  const people=[];const rng=XLSX.utils.decode_range(ws['!ref']||'A1:N301');
  // 「최종 분류 직급」 열이 있으면 함께 읽는다 (1행 머리글에 '최종'이 들어간 O열 이후 칸)
  let finCol=null;for(let ci=14;ci<=Math.min(rng.e.c,60);ci++){const h=cell(XLSX.utils.encode_col(ci)+'1');if(h&&String(h).includes('최종')){finCol=XLSX.utils.encode_col(ci);break;}}
  const finOf=v=>{const s=String(v??'').trim().toUpperCase();return /^G[1-4]$/.test(s)?s:'';};
  for(let r=2;r<=Math.min(rng.e.r+1,1000);r++){const g=col=>cell(col+r);if(g('B')==null||String(g('B')).trim()==='')continue;
    people.push({id:String(g('A')??''),name:String(g('B')).trim(),age:num(g('C'))??'',dept:g('D')??'',job:g('E')??'',title:g('F')??'',grade:String(g('G')??'').trim(),
      hire:g('H') instanceof Date?dateStr(g('H')):(g('H')??''),gdate:g('J') instanceof Date?dateStr(g('J')):(g('J')??''),period:g('K')??'',adj:g('L')??'',salary:num(g('M'))??'',final:finCol?finOf(g(finCol)):''});}
  if(!people.length)throw new Error('기본정보 시트 B열(이름)에 인원이 없습니다.');
  const c=defaultCrit();const n=a=>num(cell(a));
  [4,5,6,7].forEach((r,i)=>{if(n('Q'+r)!=null)c.bands[i][0]=n('Q'+r);if(n('R'+r)!=null)c.bands[i][1]=n('R'+r);});
  [11,12,13].forEach((r,i)=>{if(n('Q'+r)!=null)c.overlaps[i][0]=n('Q'+r);if(n('R'+r)!=null)c.overlaps[i][1]=n('R'+r);});
  if(n('V4')!=null)c.retAge=n('V4');
  [33,34,35].forEach((r,i)=>{if(n('Q'+r)!=null)c.stay[i][0]=n('Q'+r);if(n('R'+r)!=null)c.stay[i][1]=n('R'+r);});
  if(n('Q36')!=null)c.rate=n('Q36');
  if(cell('Q37'))c.mode=String(cell('Q37'));
  const cols=[];for(let i=0;i<30;i++)cols.push(XLSX.utils.encode_col(17+i)); // R..AU
  [52,51,50,49].forEach((r,gi)=>{cols.forEach((cl,y)=>{const v=n(cl+r);c.ovr[gi][y]=v==null?'':v;});}); // 52=G1 … 49=G4
  S.people=people;S.crit=c;S.source='file';S.sourceName=fname;S.sel='';S.an.rate=+(c.rate*100).toFixed(2);S.an.gRates=[S.an.rate,S.an.rate,S.an.rate,S.an.rate];save();route();
  toast(`${fname}: ${people.length}명과 분류 기준을 불러왔습니다.`);
}
document.getElementById('file-xlsx').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){toast('엑셀 해석 모듈을 불러오지 못했습니다. 「붙여넣기」를 쓰세요.');return;}
  const rd=new FileReader();rd.onload=()=>{try{importWorkbook(XLSX.read(rd.result,{type:'array',cellDates:true}),f.name);}catch(err){toast(err.message);}e.target.value='';};rd.readAsArrayBuffer(f);});
document.getElementById('btn-paste').onclick=()=>{const box=document.getElementById('dlg-box');
  box.innerHTML=`<div class="hd"><h2 style="margin:0">엑셀에서 붙여넣기</h2><button type="button" id="dlg-close">닫기</button></div>
  <p class="sub">기본정보 시트의 A~M열(사번 · 이름 · 나이 · 부서 · 직군 · 직책 · 현직급 · 입사년도 · 남은정년 · 발령일 · 기간 · 조정 · 현 연봉)을 머리글 없이 복사해 붙여넣으세요. N열(분류 직급) 다음 O열에 최종 분류 직급(G1~G4)이 있으면 함께 읽습니다. 분류 기준은 지금 값을 유지합니다.</p>
  <textarea id="paste-ta" placeholder="218012	홍길동	34	작물보호팀	일반직	담당	G2	2018-05-02		2022-10-01	4년3월		52171690"></textarea>
  <div class="bar" style="margin-top:8px"><span class="grow"></span><button type="button" id="paste-cancel">취소</button><button type="button" class="primary" id="paste-ok">인원 교체</button></div>`;
  const d=document.getElementById('dlg');d.hidden=false;const close=()=>d.hidden=true;box.querySelector('#dlg-close').onclick=close;box.querySelector('#paste-cancel').onclick=close;
  box.querySelector('#paste-ta').focus();
  box.querySelector('#paste-ok').onclick=()=>{const txt=box.querySelector('#paste-ta').value;const rows=txt.split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.length>=2&&c[1].trim()!==''&&c[1].trim()!=='이름');
    if(!rows.length){toast('붙여넣은 행이 없습니다. 탭으로 구분된 엑셀 행을 넣으세요.');return;}
    const dt=v=>String(v||'').trim().replace(/\./g,'-').replace(/-$/,'');
    S.people=rows.map(c=>({id:c[0]?.trim()||'',name:c[1].trim(),age:num(c[2])??'',dept:c[3]?.trim()||'',job:c[4]?.trim()||'',title:c[5]?.trim()||'',grade:c[6]?.trim()||'',hire:dt(c[7]),gdate:dt(c[9]),period:c[10]?.trim()||'',adj:c[11]?.trim()||'',salary:num(c[12])??'',final:/^G[1-4]$/.test((c[14]||'').trim().toUpperCase())?(c[14]).trim().toUpperCase():''}));
    S.source='file';S.sourceName='붙여넣기';S.sel='';save();close();route();toast(`${S.people.length}명을 불러왔습니다.`);};};
let resetArmed=false;
document.getElementById('btn-reset').onclick=e=>{const b=e.currentTarget;if(!resetArmed){resetArmed=true;b.textContent='한 번 더 누르면 초기화';b.classList.add('primary');setTimeout(()=>{resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');},3000);return;}
  resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');S=fresh();save();route();toast('예시 데이터로 되돌렸습니다.');};

/* =========================================================
   6. 라우팅
   ========================================================= */
function route(){
  const an=location.hash==='#analysis';
  document.getElementById('view-payband').hidden=an;document.getElementById('view-analysis').hidden=!an;
  document.getElementById('nav-payband').setAttribute('aria-current',an?'false':'page');document.getElementById('nav-analysis').setAttribute('aria-current',an?'page':'false');
  const b=document.getElementById('srcbadge');const n=S.people.filter(p=>String(p.name||'').trim()).length;
  b.textContent=S.source==='demo'?`예시 데이터 · ${n}명 (가상 인원)`:`${S.sourceName||'불러온 데이터'} · ${n}명`;b.classList.toggle('real',S.source!=='demo');
  if(an)renderAnalysis();else renderPayband();
}
window.addEventListener('hashchange',route);
route();
</script>
