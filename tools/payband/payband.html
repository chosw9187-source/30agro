<script>
'use strict';
/* =========================================================
   0. 상태 · 저장
   ========================================================= */
const LS_KEY='sg30-payband-v1';
const BASE_YEAR=2026, TODAY=new Date(2026,10,3);
const GRADE6=['G1','G2','G3','G4','G5','G6'];
const CLASS_KEYS=['G1','G1, G2','G2','G2, G3','G3','G3, G4','G4','밴드 미달','밴드 초과'];
const OV_LABEL=['G1~G2','G2~G3','G3~G4'];

function defaultCrit(){return{
  bands:[[4000,5500],[4700,6700],[5600,8100],[6700,9900]],           // ① 직급별 Pay-band (만원)
  overlaps:[[4700,5500],[5600,6700],[6700,8100]],                     // ② 중첩 구간 (만원)
  retAge:55,                                                          // 정년 기준(만 나이)
  stay:[[4,0],[4,0],[5,0]],                                           // ④ 기준 연수 / 누락 연수
  rate:0.025,                                                         // ④ 연 상승률
  mode:'배치 연차 기준',                                               // ④ 첫 승진 시점 산정
  ovr:[Array(30).fill(''),Array(30).fill(''),Array(30).fill(''),Array(30).fill('')] // ⑥ 수기 조정 (G1..G4)
};}
function demoPeople(){

const num=v=>{if(v===''||v==null)return null;const n=typeof v==='number'?v:+String(v).replace(/[,\s원]/g,'');return isFinite(n)?n:null;};
const ovW=v=>{const n=num(v);if(n==null)return null;return n<100000?n*10000:n;};
const stayYears=(c,g)=>(+c.stay[g-1][0]||0)+(+c.stay[g-1][1]||0); // g=1..3 : G g → G g+1

function classify(salWon,c){ // 기본정보 N열
  if(salWon==null)return '';
  const m=salWon/10000, o=c.overlaps, b=c.bands;
  if(m>=o[2][0]&&m<=o[2][1])return 'G3, G4';
  if(m>=o[1][0]&&m<=o[1][1])return 'G2, G3';
  if(m>=o[0][0]&&m<=o[0][1])return 'G1, G2';
  for(let i=0;i<4;i++)if(m>=b[i][0]&&m<=b[i][1])return 'G'+(i+1);
  return m<b[0][0]?'밴드 미달':'밴드 초과';
}
function classCss(k){return k==='G1, G2'?'c-ov12':k==='G2, G3'?'c-ov23':k==='G3, G4'?'c-ov34':k==='밴드 미달'?'c-under':k==='밴드 초과'?'c-over':'';}
function remYears(p,c){const a=num(p.age);return a==null?null:Math.max(c.retAge-a,0);}

function stdTable(c){ // ⑤ 직급·연차별 기준연봉표 (원), T[g][1..30]
  const T={},cls={};
  for(let g=1;g<=4;g++){const mn=c.bands[g-1][0]*10000, MX=c.bands[g-1][1]*10000;T[g]=[null];cls[g]=[null];
    for(let y=1;y<=30;y++){const o=ovW(c.ovr[g-1][y-1]);let v;
      if(o!=null)v=Math.min(MX,o);else if(y===1)v=mn;else v=Math.min(MX,T[g][y-1]*(1+c.rate));
      T[g][y]=v;
      cls[g][y]=o!=null?'c-ovr':(v>=MX?'c-cap':(g<4&&y>stayYears(c,g)?'c-stay':''));}}
  return{T,cls};
}
function scenario(p,g,c,tab){ // 계산 시트 J~DD(①) / DF~HA(②)
  const sal=num(p.salary);const F=remYears(p,c)??0;const row=tab.T[g];
  let n0=0;for(let y=1;y<=30;y++)if(row[y]<=sal)n0++;n0=Math.max(1,n0);
  const d1=g>=4?999:(c.mode==='현 시점부터 기준연수'?stayYears(c,g):Math.max(stayYears(c,g)-n0,0)+1);
  const d2=g>=3?999:d1+stayYears(c,g+1);
  const d3=g>=2?999:d2+stayYears(c,g+2);
  const gr=t=>g+(t>=d1)+(t>=d2)+(t>=d3);
  const G=[],W=[];
  for(let t=0;t<=45;t++){G[t]=gr(t);
    if(t===0){W[0]=sal;continue;}
    const prev=W[t-1];
    if(t>F){W[t]=prev;continue;}
    const gt=G[t];let idx=t>=d3?t-d3+1:t>=d2?t-d2+1:t>=d1?t-d1+1:n0+t;idx=Math.min(30,idx);
    W[t]=Math.max(prev,Math.min(c.bands[gt-1][1]*10000,Math.max(prev*(1+c.rate),tab.T[gt][idx])));}
  const fi=Math.min(F,45);const age=num(p.age);
  let path;
  if(g>=4)path='최고 직급';
  else{const parts=[];[d1,d2,d3].forEach((d,k)=>{if(d<=F&&g+k+1<=4)parts.push(`${age+d}세 G${g+k+1}`);});path=parts.length?parts.join(' → '):'승진 없음(정년 도달)';}
  const cagr=F>0&&sal>0?Math.pow(W[fi]/sal,1/F)-1:null;
  return{g,n0,d:[d1,d2,d3],G,W,final:W[fi],finalG:G[fi],path,F,cagr};
}
function computeAll(){
  const c=S.crit,tab=stdTable(c);
  const rows=S.people.filter(p=>String(p.name||'').trim()!=='').map(p=>{
    const sal=num(p.salary);const k=classify(sal,c);
    const g1=k===''?null:k==='밴드 미달'?1:k==='밴드 초과'?4:+k[1];
    const g2=k.includes(',')?+k[5]:null;
    const sc1=g1&&sal?scenario(p,g1,c,tab):null;const sc2=g2&&sal?scenario(p,g2,c,tab):null;
    const fin=/^G[1-4]$/.test(p.final||'')?+p.final[1]:null;
    return{p,sal,k,g1,g2,fin,app:fin||g1,rem:remYears(p,c),sc1,sc2};});
  return{c,tab,rows};
}

// 엑셀 자동필터처럼: 머리글 ▾ → 오름/내림차순 정렬 · 필터 해제 · 검색 · 값 체크 목록 · 확인/취소

function thLabel(th){return th.dataset.label||(th.dataset.label=th.textContent.replace(/[▾▲▼]/g,'').replace(/\s+/g,' ').trim());}
function sortable(tbl,id){if(!tbl||!tbl.tHead)return;const hr=tbl.tHead.rows[tbl.tHead.rows.length-1];
  [...hr.cells].forEach((th,i)=>{if(th.hasAttribute('data-nosort'))return;thLabel(th);th.classList.add('fth');
    if(!th.querySelector('.fbtn'))th.insertAdjacentHTML('beforeend','<button type="button" class="fbtn" tabindex="-1" aria-hidden="true">▾</button>');
    th.tabIndex=0;th.title='눌러서 정렬·필터';

function rowPass(r,id,skip){const f=FILTST[id];if(!f)return true;for(const ci in f){if(+ci===skip)continue;if(f[ci].has(cellText(r.cells[ci])))return false;}return true;}
function applySort(tbl,id){const st=SORTST[id];const hr=tbl.tHead.rows[tbl.tHead.rows.length-1];const f=FILTST[id]||{};
  [...hr.cells].forEach((th,i)=>{th.querySelector('.arr')?.remove();if(th.hasAttribute('data-nosort'))return;
    if(st&&st.i===i)th.querySelector('.fbtn').insertAdjacentHTML('beforebegin',`<span class="arr">${st.d>0?'▲':'▼'}</span>`);
    th.classList.toggle('filtered',!!f[i]);th.setAttribute('aria-sort',st&&st.i===i?(st.d>0?'ascending':'descending'):'none');});
  const tb=tbl.tBodies[0];const all=[...tb.rows];const rows=all.filter(r=>!r.hasAttribute('data-fixed')),fixed=all.filter(r=>r.hasAttribute('data-fixed'));
  if(st){rows.sort((a,b)=>{const va=sortVal(a.cells[st.i]),vb=sortVal(b.cells[st.i]);if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;
    const d=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'ko',{numeric:true});return d*st.d;});
    rows.forEach(r=>tb.appendChild(r));fixed.forEach(r=>tb.appendChild(r));}
  let shown=0;rows.forEach(r=>{if(r.cells.length<2){return;}const ok=rowPass(r,id,-1);r.hidden=!ok;if(ok)shown++;});
  let cap=tbl.parentElement.querySelector(':scope > .fcount');const nf=Object.keys(f).length;
  if(nf){if(!cap){cap=document.createElement('div');cap.className='fcount';tbl.parentElement.insertBefore(cap,tbl);}
    cap.innerHTML=`필터 적용 중: <b>${shown}</b> / ${rows.length}행 표시 <button type="button">모든 필터 해제</button>`;cap.querySelector('button').onclick=()=>{delete FILTST[id];applySort(tbl,id);};}
  else cap?.remove();}
function closeFilter(){document.querySelector('.fmenu')?.remove();document.removeEventListener('mousedown',outsideFilter,true);}
function outsideFilter(e){if(!e.target.closest('.fmenu'))closeFilter();}
function openFilter(tbl,id,ci,th){
  closeFilter();const f=FILTST[id]=FILTST[id]||{};const ex=f[ci]||new Set();
  const rows=[...tbl.tBodies[0].rows].filter(r=>!r.hasAttribute('data-fixed')&&r.cells.length>1&&rowPass(r,id,ci));
  const cnt=new Map();rows.forEach(r=>{const t=cellText(r.cells[ci]);cnt.set(t,(cnt.get(t)||0)+1);});
  const sample=rows.map(r=>sortVal(r.cells[ci])).filter(v=>v!=null);const isNum=sample.length&&sample.every(v=>typeof v==='number');
  const vals=[...cnt.keys()].sort((a,b)=>{if(a==='')return 1;if(b==='')return -1;
    if(isNum){const na=parseFloat(a.replace(/[,%원]/g,'')),nb=parseFloat(b.replace(/[,%원]/g,''));if(!isNaN(na)&&!isNaN(nb))return na-nb;}
    return a.localeCompare(b,'ko',{numeric:true});});
  const lbl=thLabel(th);const kind=isNum?'숫자':'텍스트';

   <input type="search" class="fsearch" placeholder="검색" aria-label="값 검색">
   <div class="flist"><label class="fall"><input type="checkbox" data-all> (모두 선택)</label>
   ${vals.map((v,k)=>`<label data-t="${esc(v.toLowerCase())}"><input type="checkbox" data-k="${k}" ${ex.has(v)?'':'checked'}> <span>${esc(v===''?EMPTY_LBL:v)}</span><small>${cnt.get(v)}</small></label>`).join('')}</div>
   <div class="fbtns"><button type="button" class="primary" data-a="ok">확인</button><button type="button" data-a="cancel">취소</button></div>`;
  document.body.appendChild(m);
  const R=th.getBoundingClientRect();const W=m.offsetWidth;m.style.top=(R.bottom+window.scrollY+2)+'px';
  m.style.left=Math.max(8,Math.min(R.left+window.scrollX,window.scrollX+document.documentElement.clientWidth-W-8))+'px';
  const boxes=[...m.querySelectorAll('[data-k]')],all=m.querySelector('[data-all]'),q=m.querySelector('.fsearch');
  const vis=()=>boxes.filter(b=>!b.closest('label').hidden);
  const sync=()=>{const v=vis(),on=v.filter(b=>b.checked).length;all.checked=v.length>0&&on===v.length;all.indeterminate=on>0&&on<v.length;m.querySelector('[data-a="ok"]').disabled=on===0;};
  all.onchange=()=>{vis().forEach(b=>b.checked=all.checked);sync();};boxes.forEach(b=>b.onchange=sync);
  q.oninput=()=>{const s=q.value.trim().toLowerCase();boxes.forEach(b=>{const l=b.closest('label');l.hidden=!!s&&!l.dataset.t.includes(s)&&!(s&&EMPTY_LBL.includes(s)&&l.dataset.t==='');if(s)b.checked=!l.hidden;});sync();};

function setCrit(path,val){const c=S.crit;
  if(path==='ratePct'){c.rate=(+val||0)/100;return;}
  if(path==='mode'){c.mode=val;return;}
  if(path==='retAge'){c.retAge=+val||0;return;}
  const [a,i,j]=path.split('.');c[a][+i][+j]=+val||0;}
function refreshInfo(){
  const {c,tab}=computeAll();
  document.querySelectorAll('#info-tbl tbody tr').forEach(tr=>{const p=S.people[+tr.dataset.i];if(!p)return;
    const r=tr.querySelector('[data-auto="_rem"]'),k=tr.querySelector('[data-auto="_cls"]');const rem=remYears(p,c);const cl=classify(num(p.salary),c);
    r.textContent=rem??'';k.textContent=cl;k.className='auto '+classCss(cl);k.dataset.v=cl in CLS_RANK?CLS_RANK[cl]:'';
    const pi=tr.querySelector('[data-f="period"]');if(pi)pi.placeholder=periodText(p);
    const fc=tr.querySelector('[data-fin]');if(fc){fc.dataset.v=finRank(p.final);fc.classList.toggle('on',!!p.final);fc.classList.toggle('bad',!!p.final&&!isCand(cl,p.final));}
    tr.classList.toggle('confirmed',!!p.final);});
  for(let i=0;i<3;i++){const e=document.getElementById('stay-app-'+i);if(e)e.textContent=stayYears(c,i+1);}
  const named=S.people.filter(p=>String(p.name||'').trim());const undec=named.filter(p=>!p.final).length;const fs=document.getElementById('fin-status');
  if(fs)fs.innerHTML=`최종 확정 <b style="color:var(--accent)">${named.length-undec}명</b> / 미확정 <b>${undec}명</b>`;
  const cnt={};GRADE6.forEach(g=>{cnt[g]={};CLASS_KEYS.forEach(k=>cnt[g][k]=0);});
  named.forEach(p=>{const cl=classify(num(p.salary),c);if(cnt[p.grade]&&cl)cnt[p.grade][cl]++;});
  const tot={};CLASS_KEYS.forEach(k=>tot[k]=GRADE6.reduce((s,g)=>s+cnt[g][k],0));
  const m=document.getElementById('matrix');
  if(m)m.innerHTML=`<table><thead><tr><th>현직급 \\ 분류</th>${CLASS_KEYS.map(k=>`<th>${k}</th>`).join('')}<th>계</th></tr></thead><tbody>
    ${GRADE6.map(g=>{const s=CLASS_KEYS.reduce((a,k)=>a+cnt[g][k],0);return`<tr><td>${g}</td>${CLASS_KEYS.map(k=>`<td class="${cnt[g][k]?classCss(k):''}">${cnt[g][k]||''}</td>`).join('')}<td><b>${s}</b></td></tr>`;}).join('')}
    <tr><td><b>계</b></td>${CLASS_KEYS.map(k=>`<td><b>${tot[k]}</b></td>`).join('')}<td><b>${CLASS_KEYS.reduce((a,k)=>a+tot[k],0)}</b></td></tr></tbody></table>`;
  const FK=['G1','G2','G3','G4','미확정'];const fc={};GRADE6.forEach(g=>{fc[g]={};FK.forEach(k=>fc[g][k]=0);});
  named.forEach(p=>{if(fc[p.grade])fc[p.grade][p.final||'미확정']++;});
  const m2=document.getElementById('matrix2');
  if(m2)m2.innerHTML=`<table><thead><tr><th>현직급 \\ 최종</th>${FK.map(k=>`<th>${k}</th>`).join('')}<th>계</th></tr></thead><tbody>
    ${GRADE6.map(g=>`<tr><td>${g}</td>${FK.map(k=>`<td class="${fc[g][k]?(k==='미확정'?'c-under':'c-fin'):''}">${fc[g][k]||''}</td>`).join('')}<td><b>${FK.reduce((a,k)=>a+fc[g][k],0)}</b></td></tr>`).join('')}
    <tr><td><b>계</b></td>${FK.map(k=>`<td><b>${GRADE6.reduce((a,g)=>a+fc[g][k],0)}</b></td>`).join('')}<td><b>${GRADE6.reduce((a,g)=>a+FK.reduce((b,k)=>b+fc[g][k],0),0)}</b></td></tr></tbody></table>`;
  const st=document.getElementById('std-tbl');if(st)st.innerHTML=stdTableHTML(c,tab,30);

function finderRows(rows){const g=S.findG||'';return rows.filter(r=>!g||'G'+r.app===g).sort((a,b)=>String(a.p.name).localeCompare(String(b.p.name),'ko'));}
function selRow(rows){const L=finderRows(rows);if(!L.length)return null;let r=L.find(x=>pkey(x.p)===S.sel);if(!r){r=L[0];S.sel=pkey(r.p);}return r;}
function finderHTML(rows){const L=finderRows(rows);
  return`<div class="finder">
   <label class="field">직급 (적용 직급)<select id="fd-g"><option value="">전체 (${rows.length}명)</option>${[1,2,3,4].map(g=>`<option value="G${g}" ${S.findG==='G'+g?'selected':''}>G${g} (${rows.filter(r=>r.app===g).length}명)</option>`).join('')}</select></label>
   <label class="field">이름 · 사번 · 직급 검색<input id="fd-q" type="search" list="fd-list" placeholder="예: 오동훈, 218012, G2" autocomplete="off" style="width:200px"></label>
   <datalist id="fd-list">${rows.map(r=>`<option value="${esc(r.p.name)}">${esc(r.p.id)} · ${appTxt(r)}</option>`).join('')}</datalist>
   <label class="field">선택 인원 (${L.length}명)<select id="sel-person">${L.map(r=>`<option value="${esc(pkey(r.p))}" ${pkey(r.p)===S.sel?'selected':''}>${esc(r.p.name)} · ${appTxt(r)}${r.fin?' 확정':''} · ${esc(r.p.id)}</option>`).join('')}</select></label>
   <span class="nav2"><button type="button" id="fd-prev" aria-label="이전 인원">◀</button><button type="button" id="fd-next" aria-label="다음 인원">▶</button></span></div>`;}
function bindFinder(rows,fn){
  const go=()=>{save();fn();};
  document.getElementById('fd-g').onchange=e=>{S.findG=e.target.value;S.sel='';go();};
  document.getElementById('sel-person').onchange=e=>{S.sel=e.target.value;go();};
  const step=d=>{const L=finderRows(rows);const i=L.findIndex(r=>pkey(r.p)===S.sel);if(!L.length)return;S.sel=pkey(L[(i+d+L.length)%L.length].p);go();};
  document.getElementById('fd-prev').onclick=()=>step(-1);document.getElementById('fd-next').onclick=()=>step(1);
  const q=document.getElementById('fd-q');
  const search=()=>{const s=q.value.trim();if(!s)return;
    if(/^g[1-4]$/i.test(s)){S.findG=s.toUpperCase();S.sel='';go();return;}
    const r=rows.find(x=>x.p.name===s||String(x.p.id)===s)||rows.find(x=>String(x.p.name).includes(s)||String(x.p.id).includes(s));
    if(!r){toast(`'${s}'에 맞는 인원이 없습니다.`);return;}
    if(S.findG&&'G'+r.app!==S.findG)S.findG='';S.sel=pkey(r.p);go();};
  q.addEventListener('change',search);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}});
}

function lifeChart(r,c){
  const F=r.rem??0;if(!r.sc1)return'';const series=[r.sc1,r.sc2].filter(Boolean);
  const W=560,H=240,L=58,Rp=14,T=14,B=30;const xs=t=>L+(F?t/F:0)*(W-L-Rp);
  const vals=series.flatMap(s=>s.W.slice(0,F+1));const lo=Math.min(...vals)*0.95,hi=Math.max(...vals)*1.03;const ys=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-Rp}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end">${fM(v)}</text>`;}
  const step=F>20?5:F>10?2:1;for(let t=0;t<=F;t+=step)g+=`<text x="${xs(t)}" y="${H-10}" text-anchor="middle">${(num(r.p.age)||0)+t}세</text>`;
  const cols=['var(--accent)','var(--warn)'];
  const lines=series.map((s,i)=>`<polyline fill="none" stroke="${cols[i]}" stroke-width="2.2" points="${s.W.slice(0,F+1).map((v,t)=>`${xs(t)},${ys(v)}`).join(' ')}"/>`+
    s.d.filter(d=>d<=F).map(d=>`<circle cx="${xs(d)}" cy="${ys(s.W[d])}" r="4" fill="var(--surface)" stroke="${cols[i]}" stroke-width="2"/>`).join('')+
    `<circle cx="${xs(F)}" cy="${ys(s.W[F])}" r="4" fill="${cols[i]}"/>`).join('');
  return`<h2>${esc(r.p.name)} · 연도별 연봉 추이 <span class="sub">(만원, ○ = 승진)</span></h2>
   <div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="연도별 연봉 추이">${g}${lines}</svg></div>
   <div class="legend"><span><i style="background:var(--accent)"></i>① 하위·단일 직급 시작</span>${r.sc2?'<span><i style="background:var(--warn)"></i>② 상위 직급 시작</span>':''}</div>`;
}

/* =========================================================
   5. 사이트 ② 임금분석
   ========================================================= */
const YS={exit:{l:'이탈',c:'over',o:0},soon:{l:'이탈 임박',c:'soon',o:1},under:{l:'하한 미달',c:'under',o:2},high:{l:'이탈 다소 높음',c:'watch',o:3},ok:{l:'안정적',c:'ok',o:4},ret:{l:'정년 이후',c:'ret',o:9}};
const YCOL={exit:'var(--crit)',soon:'var(--warn)',under:'var(--under)',high:'var(--care)',ok:'var(--ok)'};
function yStatus(pr,an){return pr>1?'exit':pr>=an.th2/100?'soon':pr>=an.th1/100?'high':pr>=0?'ok':'under';}
function anBandGrade(r,basis){if(r.fin)return r.fin;if(!r.k)return null;if(r.k==='밴드 미달')return 1;if(r.k==='밴드 초과')return 4;if(r.k.includes(','))return basis==='upper'?r.g2:r.g1;return r.g1;}
function quart(pr){return pr<0.25?0:pr<0.5?1:pr<0.75?2:3;}
function project(r,c,an,scen){
  const g=anBandGrade(r,an.basis);const mn0=c.bands[g-1][0]*1e4,mx0=c.bands[g-1][1]*1e4;
  const H=+an.horizon,br=(+an.bandRate||0)/100;const base=(an.byGrade?+an.gRates[g-1]:+an.rate)||0;
  const L=Math.min(45,Math.max(H,r.rem??H));
  const pts=[{t:0,s:r.sal,mn:mn0,mx:mx0,rate:0}];let s=r.sal,exitT=null;
  for(let t=1;t<=L;t++){const p=pts[t-1];const pr=(p.s-p.mn)/(p.mx-p.mn);
    const rt=base+(scen==='B'?(+an.qadj[quart(pr)]||0):0);s=s*(1+rt/100);
    const f=Math.pow(1+br,t);pts.push({t,s,mn:mn0*f,mx:mx0*f,rate:rt});
    if(exitT==null&&(r.rem==null||t<=r.rem)&&s>mx0*f&&r.sal<=mx0)exitT=t;}
  pts.forEach(p=>{p.pr=(p.s-p.mn)/(p.mx-p.mn);p.st=(r.rem!=null&&p.t>r.rem)?'ret':yStatus(p.pr,an);});
  const upto=Math.min(H,r.rem??H);let worst='ok';for(let t=0;t<=upto;t++){if(YS[pts[t].st].o<YS[worst].o)worst=pts[t].st;}
  const rt=r.rem!=null?Math.min(r.rem,45):null;
  return{r,g,mn0,mx0,mid0:(mn0+mx0)/2,pr0:pts[0].pr,compa:r.sal/((mn0+mx0)/2),pts,exitT,sH:pts[H].s,prH:pts[H].pr,st:worst,rt,ret:rt!=null?pts[rt]:null};
}
function analyze(scen){const all=computeAll();const list=all.rows.filter(r=>r.sal&&r.k).map(r=>project(r,all.c,S.an,scen));return{...all,list};}
function summarize(list,an){
  const n=list.length,H=+an.horizon;const inB=p=>p.s>=p.mn&&p.s<=p.mx;
  const cnt=k=>list.filter(x=>x.st===k).length;

}
function posBar(p0,pH,midPr,col,label){ // Min-Mid-Max 막대, ● 현재 / ○ 미래
  const W=200,H=34,pad=8;const lo=-0.35,hi=1.35;const X=v=>pad+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W-2*pad);

  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">
   <line x1="${pad}" x2="${W-pad}" y1="15" y2="15" stroke="var(--line-2)"/>

function openDetail(x){
  const an=S.an;const H=Math.max(+an.horizon,Math.min(x.rt??10,x.pts.length-1));const pts=x.pts.slice(0,H+1);
  const W=640,Hh=250,L=60,R=16,T=12,B=28;const xs=t=>L+t/H*(W-L-R);
  const vals=pts.flatMap(p=>[p.s,p.mn,p.mx]);const lo=Math.min(...vals)*0.96,hi=Math.max(...vals)*1.03;const ys=v=>T+(1-(v-lo)/(hi-lo))*(Hh-T-B);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end">${fM(v)}</text>`;}
  const stp=H>12?2:1;pts.forEach(p=>{if(p.t%stp===0)g+=`<text x="${xs(p.t)}" y="${Hh-8}" text-anchor="middle">${BASE_YEAR+p.t}</text>`;});
  const pl=k=>pts.map(p=>`${xs(p.t)},${ys(k(p))}`).join(' ');
  const band=`<polygon fill="var(--accent-soft)" points="${pl(p=>p.mx)} ${pts.slice().reverse().map(p=>`${xs(p.t)},${ys(p.mn)}`).join(' ')}"/>
    <polyline fill="none" stroke="var(--accent)" points="${pl(p=>p.mx)}"/><polyline fill="none" stroke="var(--accent)" points="${pl(p=>p.mn)}"/>
    <polyline fill="none" stroke="var(--muted)" stroke-dasharray="4 3" points="${pl(p=>(p.mn+p.mx)/2)}"/>`;
  const line=`<polyline fill="none" stroke="var(--ink)" stroke-width="2.2" points="${pl(p=>p.s)}"/>`+pts.map(p=>`<circle cx="${xs(p.t)}" cy="${ys(p.s)}" r="3.5" fill="${p.st==='ret'?'var(--muted)':YCOL[p.st]}"/>`).join('');
  const box=document.getElementById('dlg-box');const p=x.r.p;
  box.innerHTML=`<div class="hd"><div><h2 style="margin:0">${esc(p.name)} <span class="sub">${esc(p.id)} · ${esc(p.dept)} · ${esc(p.title)} · 만 ${esc(p.age)}세</span></h2>
    <p class="sub">적용 밴드 G${x.g} (${x.r.fin?'수기 확정':'1차 자동 · 분류 '+x.r.k}) · Min ${fM(x.mn0)} / Mid ${fM(x.mid0)} / Max ${fM(x.mx0)}만원 · 정년 ${x.rt!=null?BASE_YEAR+x.rt+'년':'-'} · ${an.scen==='B'?'B안 차등':'A안 일률'} 인상</p></div>
    <button type="button" id="dlg-close">닫기</button></div>
    <p style="margin:0 0 8px">종합 판정 ${chip(x.st)}</p>
    <div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:480px" role="img" aria-label="연도별 연봉과 밴드">${g}${band}${line}</svg></div>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>Pay-band (Min~Max)</span><span><i style="background:var(--muted)"></i>Mid</span><span><i style="background:var(--ink)"></i>예상 연봉 (만원, 점 색 = 판정)</span></div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th>연도</th><th>나이</th><th>인상률</th><th>예상 연봉(원)</th><th>Min</th><th>Max</th><th>위치</th><th>판정</th></tr></thead><tbody>
    ${pts.map(q=>`<tr><td>${BASE_YEAR+q.t}${q.t===0?' (현재)':''}${q.t===x.rt?' (정년)':''}</td><td>${(num(p.age)||0)+q.t}</td><td class="num">${q.t?q.rate.toFixed(1)+'%':'-'}</td><td class="num">${fW(q.s)}</td><td class="num">${fW(q.mn)}</td><td class="num">${fW(q.mx)}</td><td class="num">${fP(q.pr)}</td><td>${chip(q.st)}</td></tr>`).join('')}
    </tbody></table></div>`;
  const d=document.getElementById('dlg');d.hidden=false;box.querySelector('#dlg-close').onclick=()=>d.hidden=true;box.querySelector('#dlg-close').focus();
}
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.currentTarget.hidden=true;});

function showText(title,txt){const box=document.getElementById('dlg-box');box.innerHTML=`<div class="hd"><h2 style="margin:0">${esc(title)}</h2><button type="button" id="dlg-close">닫기</button></div><p class="sub">아래 내용을 전체 선택(Ctrl+A) 후 복사하세요.</p><textarea id="dlg-ta" readonly></textarea>`;

function importWorkbook(wb,fname){
  const ws=wb.Sheets['기본정보']||wb.Sheets[wb.SheetNames[0]];if(!ws)throw new Error('기본정보 시트를 찾지 못했습니다.');
  const cell=a=>{const c=ws[a];return c?c.v:undefined;};
  const people=[];const rng=XLSX.utils.decode_range(ws['!ref']||'A1:N301');
  // 「최종 분류 직급」 열이 있으면 함께 읽는다 (1행 머리글에 '최종'이 들어간 O열 이후 칸)
  let finCol=null;for(let ci=14;ci<=Math.min(rng.e.c,60);ci++){const h=cell(XLSX.utils.encode_col(ci)+'1');if(h&&String(h).includes('최종')){finCol=XLSX.utils.encode_col(ci);break;}}
  const finOf=v=>{const s=String(v??'').trim().toUpperCase();return /^G[1-4]$/.test(s)?s:'';};
  for(let r=2;r<=Math.min(rng.e.r+1,1000);r++){const g=col=>cell(col+r);if(g('B')==null||String(g('B')).trim()==='')continue;
    people.push({id:String(g('A')??''),name:String(g('B')).trim(),age:num(g('C'))??'',dept:g('D')??'',job:g('E')??'',title:g('F')??'',grade:String(g('G')??'').trim(),
      hire:g('H') instanceof Date?dateStr(g('H')):(g('H')??''),gdate:g('J') instanceof Date?dateStr(g('J')):(g('J')??''),period:g('K')??'',adj:g('L')??'',salary:num(g('M'))??'',final:finCol?finOf(g(finCol)):''});}
  if(!people.length)throw new Error('기본정보 시트 B열(이름)에 인원이 없습니다.');
  const c=defaultCrit();const n=a=>num(cell(a));
  [4,5,6,7].forEach((r,i)=>{if(n('Q'+r)!=null)c.bands[i][0]=n('Q'+r);if(n('R'+r)!=null)c.bands[i][1]=n('R'+r);});
  [11,12,13].forEach((r,i)=>{if(n('Q'+r)!=null)c.overlaps[i][0]=n('Q'+r);if(n('R'+r)!=null)c.overlaps[i][1]=n('R'+r);});
  if(n('V4')!=null)c.retAge=n('V4');
  [33,34,35].forEach((r,i)=>{if(n('Q'+r)!=null)c.stay[i][0]=n('Q'+r);if(n('R'+r)!=null)c.stay[i][1]=n('R'+r);});
  if(n('Q36')!=null)c.rate=n('Q36');
  if(cell('Q37'))c.mode=String(cell('Q37'));
  const cols=[];for(let i=0;i<30;i++)cols.push(XLSX.utils.encode_col(17+i)); // R..AU
  [52,51,50,49].forEach((r,gi)=>{cols.forEach((cl,y)=>{const v=n(cl+r);c.ovr[gi][y]=v==null?'':v;});}); // 52=G1 … 49=G4
  S.people=people;S.crit=c;S.source='file';S.sourceName=fname;S.sel='';S.an.rate=+(c.rate*100).toFixed(2);S.an.gRates=[S.an.rate,S.an.rate,S.an.rate,S.an.rate];save();route();
  toast(`${fname}: ${people.length}명과 분류 기준을 불러왔습니다.`);
}
document.getElementById('file-xlsx').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){toast('엑셀 해석 모듈을 불러오지 못했습니다. 「붙여넣기」를 쓰세요.');return;}
  const rd=new FileReader();rd.onload=()=>{try{importWorkbook(XLSX.read(rd.result,{type:'array',cellDates:true}),f.name);}catch(err){toast(err.message);}e.target.value='';};rd.readAsArrayBuffer(f);});
document.getElementById('btn-paste').onclick=()=>{const box=document.getElementById('dlg-box');
  box.innerHTML=`<div class="hd"><h2 style="margin:0">엑셀에서 붙여넣기</h2><button type="button" id="dlg-close">닫기</button></div>
  <p class="sub">기본정보 시트의 A~M열(사번 · 이름 · 나이 · 부서 · 직군 · 직책 · 현직급 · 입사년도 · 남은정년 · 발령일 · 기간 · 조정 · 현 연봉)을 머리글 없이 복사해 붙여넣으세요. N열(분류 직급) 다음 O열에 최종 분류 직급(G1~G4)이 있으면 함께 읽습니다. 분류 기준은 지금 값을 유지합니다.</p>
  <textarea id="paste-ta" placeholder="218012	홍길동	34	작물보호팀	일반직	담당	G2	2018-05-02		2022-10-01	4년3월		52171690"></textarea>
  <div class="bar" style="margin-top:8px"><span class="grow"></span><button type="button" id="paste-cancel">취소</button><button type="button" class="primary" id="paste-ok">인원 교체</button></div>`;
  const d=document.getElementById('dlg');d.hidden=false;const close=()=>d.hidden=true;box.querySelector('#dlg-close').onclick=close;box.querySelector('#paste-cancel').onclick=close;
  box.querySelector('#paste-ta').focus();
  box.querySelector('#paste-ok').onclick=()=>{const txt=box.querySelector('#paste-ta').value;const rows=txt.split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.length>=2&&c[1].trim()!==''&&c[1].trim()!=='이름');
    if(!rows.length){toast('붙여넣은 행이 없습니다. 탭으로 구분된 엑셀 행을 넣으세요.');return;}
    const dt=v=>String(v||'').trim().replace(/\./g,'-').replace(/-$/,'');
    S.people=rows.map(c=>({id:c[0]?.trim()||'',name:c[1].trim(),age:num(c[2])??'',dept:c[3]?.trim()||'',job:c[4]?.trim()||'',title:c[5]?.trim()||'',grade:c[6]?.trim()||'',hire:dt(c[7]),gdate:dt(c[9]),period:c[10]?.trim()||'',adj:c[11]?.trim()||'',salary:num(c[12])??'',final:/^G[1-4]$/.test((c[14]||'').trim().toUpperCase())?(c[14]).trim().toUpperCase():''}));
    S.source='file';S.sourceName='붙여넣기';S.sel='';save();close();route();toast(`${S.people.length}명을 불러왔습니다.`);};};
let resetArmed=false;
document.getElementById('btn-reset').onclick=e=>{const b=e.currentTarget;if(!resetArmed){resetArmed=true;b.textContent='한 번 더 누르면 초기화';b.classList.add('primary');setTimeout(()=>{resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');},3000);return;}
  resetArmed=false;b.textContent='예시로 초기화';b.classList.remove('primary');S=fresh();save();route();toast('예시 데이터로 되돌렸습니다.');};

/* =========================================================
   8. 라우팅
   ========================================================= */
function route(){
  const h=location.hash==='#analysis'?'analysis':location.hash==='#labor'?'labor':'payband';
  ['payband','analysis','labor'].forEach(k=>{document.getElementById('view-'+k).hidden=k!==h;document.getElementById('nav-'+k).setAttribute('aria-current',k===h?'page':'false');});
  const b=document.getElementById('srcbadge');const n=S.people.filter(p=>String(p.name||'').trim()).length;
  b.textContent=S.source==='demo'?`예시 데이터 · ${n}명 (가상 인원)`:`${S.sourceName||'불러온 데이터'} · ${n}명`;b.classList.toggle('real',S.source!=='demo');
  ({payband:renderPayband,analysis:renderAnalysis,labor:renderLabor})[h]();
}
window.addEventListener('hashchange',route);
route();
</script>
