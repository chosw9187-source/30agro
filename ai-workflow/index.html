<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>본부 AI 워크플로우</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:light;--navy:#0d2340;--bg:#f3f5f9;--line:#e3e8ef;--ink:#1e293b;--sub:#5b6b80;--orange:#f59e0b;--team:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.top{background:linear-gradient(90deg,#0d2340,#173a66);color:#fff}
.top-in,.bar-in,.days-in,main,footer{max-width:1480px;margin:0 auto}
.top-in{padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;flex:1;min-width:260px}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.brand p{margin:2px 0 0;font-size:11.5px;color:#b9c7dc}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zoom{display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:4px 6px;font-size:11px;color:#b9c7dc}
.zoom button{width:24px;height:24px;border-radius:6px;border:0;background:#fff;color:#0d2340;font-weight:800;cursor:pointer}
.zoom b{background:var(--orange);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.hbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 12px;font-weight:700;font-size:12px;cursor:pointer}
.pill-o{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700}
.bar{background:#102b4d;color:#fff}
.bar-in{padding:8px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.prof{display:flex;gap:8px;align-items:center;background:none;border:0;color:#dbe6f5;font-size:12px;cursor:pointer;padding:0;text-align:left}
.prof .okb{background:#16a34a;color:#fff;border-radius:999px;padding:2px 9px;font-weight:700;font-size:11px;flex:none}
.prof .edit{color:#93b4dc;text-decoration:underline;font-size:11px;flex:none}
.teams{display:flex;gap:6px;flex-wrap:wrap}
.teams button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#dbe6f5;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.teams button.on{background:#fff;color:var(--team);border-color:#fff}
.profedit{max-width:1480px;margin:0 auto;padding:4px 20px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.profedit[hidden]{display:none}
.profedit label{display:flex;flex-direction:column;font-size:11px;color:#b9c7dc;gap:3px}
.profedit input{border:0;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;width:170px}
.profedit .sv{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:800;cursor:pointer}
.days{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.days-in{padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.days button{border:0;background:none;padding:12px 12px 9px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.days .no{font-size:10px;background:#eef2f7;border-radius:999px;padding:1px 6px;font-weight:700}
.days button.on{color:var(--team);font-weight:800;border-bottom-color:var(--team)}
.days button.on .no{background:var(--team);color:#fff}
main{padding:20px}
.secbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.secbar button{border:1px solid var(--line);background:#f6f8fb;border-radius:999px;padding:9px 18px;font-weight:700;color:#475569;cursor:pointer;font-size:13.5px}
.secbar button.on{background:var(--team);color:#fff;border-color:var(--team);box-shadow:0 4px 12px color-mix(in srgb,var(--team) 35%,transparent)}
.hero{background:linear-gradient(120deg,#0d2340 30%,color-mix(in srgb,var(--team) 70%,#0d2340));color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:18px}
.hero .hb{background:var(--orange);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:12.5px;vertical-align:middle}
.hero h2{display:inline;font-size:19px;margin:0 0 0 8px;vertical-align:middle}
.hero p{margin:6px 0 0;color:#dbe6f5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chips button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chips button.on{background:#fff;color:#0d2340}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.grid2>div{min-width:0}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.card-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.card-h h3{margin:0;font-size:15.5px;letter-spacing:-.2px}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 10px;color:#fff;background:#0d2340;flex:none}
.tag.진행{background:var(--orange)}.tag.실습{background:#16a34a}.tag.참고{background:#64748b}
.card-b{padding:18px 20px}
.lead{font-size:16px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.leadp{color:#475569;margin:0 0 4px}
.box{border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.box h4{margin:0 0 4px;font-size:14.5px}
.box p{margin:0;color:#475569}
.story{background:color-mix(in srgb,var(--team) 7%,#fff);border:1px solid color-mix(in srgb,var(--team) 30%,#fff);border-radius:12px;padding:16px 18px}
.story p{margin:0 0 6px}
.story ul{margin:10px 0 0;padding-left:0;list-style:none}
.story li{margin:3px 0}
.note{background:#f8fafc;border-left:3px solid var(--orange);border-radius:8px;padding:10px 14px;color:#64748b;font-size:12.5px;margin:12px 0}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px 16px;margin:12px 0;color:#7c2d12}
.danger{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;margin:12px 0;color:#7f1d1d}
.good{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 16px;margin:12px 0;color:#14532d}
.sub{display:flex;gap:8px;align-items:center;font-weight:800;margin:20px 0 10px;font-size:14px}
.sub:first-child{margin-top:0}
.sub::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--team);flex:none}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:#f1f4f8;text-align:left;padding:8px 10px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid #eef1f5;vertical-align:top}
.chk{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #eef1f5;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--team);flex:none}
.chk b{display:block}
.chk span{color:#64748b;font-size:12.5px}
.pc{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;background:#fbfcfe}
.pc-h{display:flex;gap:6px;align-items:center;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pc-h b{font-size:13.5px}
.rl{width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:800;color:#fff;display:inline-grid;place-items:center;flex:none}
.rl.r{background:#2563eb}.rl.i{background:#16a34a}.rl.c{background:#ea580c}.rl.e{background:#7c3aed}
.sp{flex:1}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#334155}
.mini.add{background:var(--team);color:#fff;border-color:var(--team)}
.mini.del{color:#b91c1c}
.pc-b{padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.75}
.pc-b .lbl{color:var(--team)}
.ph{background:#fef3c7;color:#92400e;border-radius:4px;padding:0 3px}
.form{display:grid;gap:12px}
.form label{font-weight:700;font-size:13px;display:grid;gap:4px}
.form label small{font-weight:400;color:var(--sub)}
.form input,.form textarea{border:1px solid #d4dbe5;border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;width:100%;background:#fff}
.form textarea{min-height:76px;resize:vertical}
.form input:focus,.form textarea:focus{outline:2px solid color-mix(in srgb,var(--team) 40%,transparent);border-color:var(--team)}
.st{font-weight:700;white-space:nowrap}
.vd{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap;margin-left:4px}
.vd.a{background:#dcfce7;color:#166534}.vd.r{background:#fee2e2;color:#991b1b}.vd.p{background:#fef9c3;color:#854d0e}.vd.x{background:#e2e8f0;color:#334155}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin:10px 0}
.cands span{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:6px 0 12px}
.flow>div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative}
.flow>div b{display:block;font-size:14px}
.flow>div span{font-size:12px;color:var(--sub)}
.flow .arrow{flex:0 0 auto;min-width:0;border:0;background:none;display:grid;place-items:center;color:#94a3b8;padding:0}
.steps{counter-reset:s;margin:8px 0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:9px 12px 9px 44px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.steps li::before{content:counter(s);position:absolute;left:12px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--team);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.final{border:2px solid var(--team);border-radius:12px;padding:12px 16px;font-weight:700;background:color-mix(in srgb,var(--team) 5%,#fff)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:6px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.kpi small{color:var(--sub);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;color:var(--team);letter-spacing:-.5px;line-height:1.3}
.kpi .d{font-size:12px;color:#94a3b8}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
.tcard:hover{box-shadow:0 6px 18px rgba(15,35,64,.08)}
.tcard .ti{font-size:24px}
.tcard b{font-size:15.5px}
.tcard span{color:#475569;font-size:13px}
.tcard em{font-style:normal;color:var(--c);font-weight:800;font-size:12.5px;margin-top:auto}
.seg{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.seg button{flex:1;min-width:220px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;color:inherit}
.seg button b{display:block;margin-bottom:2px}
.seg button span{color:#64748b;font-size:12.5px}
.seg button.on{border-color:var(--team);background:color-mix(in srgb,var(--team) 6%,#fff)}
.hand{background:#fffbeb;border:1px dashed #f59e0b;border-radius:12px;padding:12px 16px;margin:0 0 12px}
.my-item{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden}
.tchip{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;color:#fff;flex:none}
.empty{text-align:center;color:#94a3b8;padding:40px 10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#0d2340;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-weight:700;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
details.ex{margin:-6px 0 12px;font-size:12.5px;color:#475569}details.ex summary{cursor:pointer;font-weight:700;color:var(--team)}details.ex p{margin:6px 0 0;background:#f8fafc;border-radius:8px;padding:8px 12px}
details.grp{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}details.grp>summary{cursor:pointer;padding:14px 18px;font-weight:800;font-size:14.5px;list-style:none}details.grp>summary::-webkit-details-marker{display:none}details.grp>summary::after{content:'펼치기 ▾';float:right;font-size:12px;color:#94a3b8;font-weight:700}details.grp[open]>summary::after{content:'접기 ▴'}.grp-b{padding:0 18px 16px}
.snip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;background:#fbfcfe}.snip>div{flex:1;min-width:0}.snip b{display:block;font-size:13px}.snip span{color:#475569;font-size:12.5px}
.sheetbox{display:grid;gap:6px;border:1px dashed #cbd5e1;border-radius:10px;padding:10px}.pal .sw{display:flex;gap:4px;margin-top:10px}.pal .sw span{width:34px;height:22px;border-radius:5px;border:1px solid #e2e8f0}
footer{padding:6px 20px 40px;text-align:center;color:#94a3b8;font-size:12px}
.muted{color:#64748b;font-size:12.5px}
@media(max-width:640px){main{padding:14px 16px}.top-in,.bar-in{padding-left:16px;padding-right:16px}.card-b{padding:14px}.hero{padding:18px}.hero h2{display:block;margin:8px 0 0}.profedit input{width:100%}.profedit label{flex:1 1 140px}}
@media print{.ctrl,.bar,.days,.secbar,.mini,.toast,.chips{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card,.pc,.box,.kpi{break-inside:avoid}.top,.hero,.tag,.rl,.vd{-webkit-print-color-adjust:exact;print-color-adjust:exact}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">🏢</div><div><h1>본부 AI 워크플로우 — 질문 · 숫자 · 결재</h1><p id="subtitle"></p></div></div>
    <div class="ctrl">
      <div class="zoom"><span>글자</span><button data-zoom="-10" aria-label="글자 작게">−</button><b id="zoomv">100%</b><button data-zoom="10" aria-label="글자 크게">+</button></div>
      <button class="hbtn" data-act="print">⬇ PDF 저장</button>
      <span class="pill-o">3단계 · 팀별 실습</span>
    </div>
  </div>
</header>
<div class="bar">
  <div class="bar-in">
    <button class="prof" data-act="profile"><span class="okb">✔ 반영됨</span><span id="profsum"></span><span class="edit">내 회사 프로필 수정</span></button>
    <nav class="teams" id="teams" aria-label="파트 선택"></nav>
  </div>
  <div class="profedit" id="profedit" hidden>
    <label>회사명<input id="pf-company"></label>
    <label>업종<input id="pf-industry"></label>
    <label>규모(인원)<input id="pf-size"></label>
    <label><span id="pf-role-l">내 직무</span><input id="pf-role"></label>
    <button class="sv" data-act="psave">반영</button>
  </div>
</div>
<nav class="days"><div class="days-in" id="days"></div></nav>
<main id="main"></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>

<script>
/* ===================== 팀별 콘텐츠 ===================== */
const TEAMS=[
{id:'hr',name:'인사팀',icon:'👥',color:'#2563eb',role:'인사기획담당',
 issue:'생산직 1년 내 퇴사율 17.5% → 26.3%',
 story:'<b>새솔산업㈜(가상)</b>은 작년 생산직 초임을 7% 올리고 입사축하금 100만 원을 새로 만들었습니다. 채용 비용만 1억 2천만 원이 더 들었습니다.</p><p>그런데 생산직 입사 1년 내 퇴사율은 <b>17.5% → 26.3%</b>로 올랐습니다. 퇴사자 10명 중 4명이 2공장에서 나왔습니다.',
 days:['돈 문제인지 아닌지, 자료로 가릴 수 있는 질문을 만듭니다','작년 입사자 152명의 기록으로 그 질문을 숫자로 판정합니다','판정 결과를 대표이사 보고서로 쓰고, 반대 논리로 스스로 공격합니다'],
 cEls:[['제도 이력','작년 초임 7% 인상·입사축하금 도입, 2년 전 4조3교대 전환','이미 해 본 처방(급여 인상)을 또 권한다'],['노사 지형','노조 있음, 임단협 3개월 앞, 교대제 변경은 협의 사항','협의 사항을 일방 결정처럼 쓴다'],['경영진 성향','대표는 비용 대비 효과를 숫자로 요구','"공감대 형성" 같은 말로 반려된다'],['조직 구조','생산직 380명 / 2개 공장 / 조장 24명','본사 사무직 기준의 일반론이 온다'],['진짜 목적','추가 인건비 없이 이탈을 줄일 수 있다는 걸 보여 주기','결론의 무게 중심이 어긋난다']],
 axes:['채용','온보딩','근무형태','현장리더','보상','근무환경'],
 roles:[['HR Business Partner','HR 비즈니스 파트너'],['Organization Development Consultant','조직개발 컨설턴트'],['Labor Relations Advisor','노무 자문'],['People Analytics Lead','인사 데이터 분석 담당'],['Talent Acquisition Expert','채용 전문가'],['Compensation Specialist','보상 전문가']],
 R:'너는 제조업 생산직 인력 이탈 문제를 15년간 다뤄 온 HR 컨설턴트야. 통념보다 자료를 먼저 본다.',
 I:'생산직 입사 1년 내 퇴사 원인 가설을 채용·온보딩·근무형태·현장리더·보상·근무환경 6개 축으로 12개 제시해. 가설마다 확인할 자료 항목과 참/거짓 판정 기준을 숫자로 붙여. 내가 주지 않은 숫자는 만들지 마.',

 else if(d.sec){S.sec[S.day]=d.sec;save();render();goTop()}
 else if(d.copy){copy(P[d.copy].text)}
 else if(d.save){const p=P[d.save];S.saved.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),team:S.team,title:p.title,text:p.text,ts:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});save();
  const tab=document.querySelector('[data-day="my"]');if(tab)tab.lastChild.textContent=' 내 프롬프트 '+S.saved.length;toast('＋ 내 프롬프트에 담았습니다')}
 else if(d.mode){S.bsMode=d.mode;save();render()}
 else if(d.dl){const R=getData(S.team);if(d.dl==='tsv')copy(toTable(R,'\t'),'표를 복사했습니다 — 엑셀 A1 칸에 붙여 넣으세요');/*DL*/else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+toTable(R,',')],{type:'text/csv;charset=utf-8'}));a.download=DASH[S.team].sheet+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}/*/DL*/}
 else if(d.act==='csadd'||d.csdel!==undefined){let sh=[];try{sh=JSON.parse(fv('cs_sheets')||'[]')}catch(e){}if(!sh.length)sh=[{n:'',c:''}];if(d.act==='csadd')sh.push({n:'',c:''});else{sh.splice(+d.csdel,1)}S.forms[S.team+'.cs_sheets']=JSON.stringify(sh);save();render()}
 else if(d.rtype){S.rsType=d.rtype;save();render()}
 else if(d.goto){const g=d.goto.split('.');S.day=g[0];S.sec[g[0]]=g[1];save();render();goTop()}
 else if(d.aud){S.aud=+d.aud;save();render()}
 else if(d.cp){const x=S.saved.find(y=>y.id===d.cp);if(x)copy(x.text)}
 else if(d.del){S.saved=S.saved.filter(y=>y.id!==d.del);save();render()}
 else if(d.zoom){S.zoom=Math.max(70,Math.min(160,S.zoom+ +d.zoom));save();$('main').style.zoom=S.zoom/100;$('zoomv').textContent=S.zoom+'%'}
 else if(d.act==='print'){window.print()}
 else if(d.act==='profile'){const pe=$('profedit');pe.hidden=!pe.hidden;if(!pe.hidden){$('pf-company').value=S.profile.company;$('pf-industry').value=S.profile.industry;$('pf-size').value=S.profile.size;$('pf-role').value=role();$('pf-role-l').textContent=T().name+' 내 직무'}}
 else if(d.act==='psave'){S.profile.company=$('pf-company').value.trim()||'우리 회사';S.profile.industry=$('pf-industry').value.trim()||'제조업';S.profile.size=$('pf-size').value.trim()||'-';S.profile.roles[S.team]=$('pf-role').value.trim()||T().role;$('profedit').hidden=true;save();render();toast('프로필을 반영했습니다')}
 else if(d.act==='copyall'){const list=S.myAll?S.saved:S.saved.filter(x=>x.team===S.team);if(!list.length){toast('복사할 프롬프트가 없습니다');return}copy(list.map(x=>`■ [${(TEAMS.find(y=>y.id===x.team)||{}).name}] ${x.title}\n\n${x.text}`).join('\n\n────────────────────\n\n'))}
 else if(d.act==='myall'){S.myAll=!S.myAll;save();render()}
 else if(d.act==='export'){const list=S.myAll?S.saved:S.saved.filter(x=>x.team===S.team);if(!list.length){toast('저장할 프롬프트가 없습니다');return}
  const txt=list.map(x=>`■ [${(TEAMS.find(y=>y.id===x.team)||{}).name}] ${x.title} (${x.ts})\n\n${x.text}`).join('\n\n────────────────────\n\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='내_프롬프트.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 else if(d.act==='clear'){if(!S.clearArm){S.clearArm=true;render();setTimeout(()=>{if(S.clearArm){S.clearArm=false;render()}},4000)}else{S.clearArm=false;S.saved=S.myAll?[]:S.saved.filter(x=>x.team!==S.team);save();render();toast('모두 지웠습니다')}}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.csi!==undefined){let sh=[];try{sh=JSON.parse(fv('cs_sheets')||'[]')}catch(x){}while(sh.length<=+el.dataset.csi)sh.push({n:'',c:''});sh[+el.dataset.csi][el.dataset.csk]=el.value;S.forms[S.team+'.cs_sheets']=JSON.stringify(sh);save();updateBuilder('cs');return}
 if(!el.dataset||!el.dataset.f)return;S.forms[S.team+'.'+el.dataset.f]=el.value;save();
 const w=el.closest('[data-builder]');if(w)updateBuilder(w.dataset.builder);
 if(/^c\d$/.test(el.dataset.f))updateBuilder('agent')});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k){S.checks[k]=e.target.checked;save()}});
render();
</script>
</body>
</html>
